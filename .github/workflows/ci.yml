# Unit tests only: no signing key here (release APKs are built locally with android/app/signing.jks).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin unit tests (child + parent)
        working-directory: android
        run: ./gradlew --no-daemon testKidDebugUnitTest :parent:testDebugUnitTest
      - name: Compile home flavor + parent app (debug, no signing)
        working-directory: android
        run: ./gradlew --no-daemon assembleHomeDebug :parent:assembleDebug
      - name: Page script parses
        run: |
          files=$(grep -o 'src="/ui/[a-z0-9-]*\.js"' ui/index.html | sed 's|src="/ui/|ui/assets/|; s|"$||')
          for f in $files; do node --check "$f"; done
          cat $files > /tmp/page.js && node --check /tmp/page.js
      - name: Feature search covers every section
        run: node scripts/check-search.mjs
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: relay/package-lock.json }
      - name: Relay tests (wrangler dev + contract)
        working-directory: relay
        run: npm ci && npm test
