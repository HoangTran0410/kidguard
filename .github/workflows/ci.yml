# Unit tests only: no signing key here (release APKs are built locally with android/app/signing.jks).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin unit tests (child + parent)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest :parent:testDebugUnitTest
      - name: Page script parses
        run: |
          node -e 'const s=require("fs").readFileSync("web/index.html","utf8");const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]).join("\n");require("fs").writeFileSync("/tmp/page.js",m)'
          node --check /tmp/page.js
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: worker/package-lock.json }
      - name: Relay tests (wrangler dev + contract)
        working-directory: worker
        run: npm ci && npm test
