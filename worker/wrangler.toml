name = "kidguard"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# web/*.html (one page for the APK and the relay) and web/vendor/qrcode.js are bundled as text
rules = [{ type = "Text", globs = ["**/*.html", "**/vendor/qrcode.js"], fallthrough = false }]

[[durable_objects.bindings]]
name = "KIDS"
class_name = "Kid"

# SQLite-backed Durable Objects run on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Kid"]

# Per-IP rate limit on /c/* (free plan). Stops a single client looping random ids to burn the daily quota;
# one family (phone sync every 20 s + a parent watching the live screen) stays far below it.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 150, period = 10 }
