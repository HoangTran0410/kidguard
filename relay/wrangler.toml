name = "kidguard"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# ui/*.html (one page for the APK and the relay) and its ui/assets/*.js|css (incl. the QR library, shared with qr.html) are bundled as text
rules = [{ type = "Text", globs = ["**/*.html", "**/ui/assets/*.js", "**/ui/assets/*.css"], fallthrough = false }]

[[durable_objects.bindings]]
name = "KIDS"
class_name = "Kid"

# SQLite-backed Durable Objects run on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Kid"]

# Per-IP rate limit on /c/* (free plan). Stops a single client looping random ids to burn the daily quota;
# one family (phone sync every 20 s + a parent watching the live screen) stays far below it.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 150, period = 10 }

# Workers Logs (dashboard > Workers > kidguard > Observability). Free: 200k events/day, 3 days; Paid: 20M/month incl., 7 days.
[observability]
enabled = true
head_sampling_rate = 1
