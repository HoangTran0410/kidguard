name = "kg-relay"   # 2026-11-18: "kidguard" was killed by Cloudflare (docs/decisions/remote.md); new name = new Durable Objects, phones re-bind on sync
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # node:crypto createHash for the PIN check (hashPin)
workers_dev = true
# the same worker on our own domain (2026-11-20): some networks filter *.workers.dev; phone + page fall back to it
routes = [{ pattern = "relay.kidguard.asia", custom_domain = true }]

# ui/*.html (one page for the APK and the relay) and its ui/assets/*.js|css (incl. the QR library, shared with qr.html) are bundled as text
minify = true   # JSON relay only: no page text in the bundle; comments out of the uploaded script

[[durable_objects.bindings]]
name = "KIDS"
class_name = "Kid"

# first-bind counter per client network (H4: stops a script creating Kid objects without limit)
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

# Zepp watch connect codes ("w:<code>", 10 min, deleted when taken)
[[durable_objects.bindings]]
name = "WATCH"
class_name = "Watch"

# SQLite-backed Durable Objects run on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Kid"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gate"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Watch"]

# Per-IP rate limit on every path but "/" and /tg (free plan). Stops a single client looping random ids or junk paths;
# /w and /p check it too. Measured per IP and 10 s (2026-11-20, audit asked for ~30): page refresh 8 s (relay) + overview
# 15 s per kid = 2-4; live screen over HTTP when the socket is blocked = one frame poll every 150-333 ms = 30-66;
# a file transfer = 1 MB chunks, up to ~100 on a fast link; several kids / a parent app + a page behind one NAT add up.
# 30 would cut the screen fallback and file transfers, so it stays 150 (a looping script still gets 15 req/s at most).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 150, period = 10 }

# Workers Logs (dashboard > Workers > kidguard > Observability). Free: 200k events/day, 3 days; Paid: 20M/month incl., 7 days.
[observability]
enabled = true
head_sampling_rate = 1
