<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidGuard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KidGuard</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--btn:#2563eb;--pri-fg:#fff;--bad-bg:#fee2e2;--bad-fg:#991b1b;--ok-bg:#dcfce7;--ok-fg:#166534;--warn-bg:#fef3c7;--warn-fg:#92400e;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e5e7eb;--mute:#9ca3af;--line:#263041;--pri:#3b82f6;--chip:#1e293b;--btn:#2563eb;--bad-bg:#3b1519;--bad-fg:#fca5a5;--ok-bg:#12301d;--ok-fg:#86efac;--warn-bg:#3a2a0b;--warn-fg:#fcd34d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:30px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:inherit;text-decoration:none;box-sizing:border-box}
button:active{filter:brightness(.92)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.pri{background:var(--btn);color:var(--pri-fg);border-color:var(--btn);font-weight:600}
button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select{max-width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.pairf{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pairf input,.pairf button{width:100%}
#code{font-size:28px;text-align:center;letter-spacing:.35em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.app{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:9px;background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1 1 50px;min-width:0}.app>button,.app>select{flex:none;margin-left:auto}.app>select{max-width:54%;padding-left:8px;padding-right:2px}.app .tag{white-space:nowrap}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-left:4px}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
.si{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none}
.err{color:var(--bad)}
iframe{width:100%;height:220px;border:0;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
/* fade the edge that still has tabs behind it (toggled by tabFade) */
.tabs.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
.tabs.fl{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent)}
.tabs.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.tabs button{white-space:nowrap}
.e{display:inline-block;width:1.4em;text-align:center;margin-right:2px}
.empty{text-align:center;padding:14px 4px;color:var(--mute)}.empty .e{display:block;width:auto;font-size:28px;margin:0 0 4px}
.tabs button.on{background:var(--btn);color:var(--pri-fg)}
code{word-break:break-all;font-size:12px}
button{min-height:44px}
.alert{background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg)}
.dpb{display:inline-flex;align-items:center;gap:6px;font-weight:600}
#dpPop,#askPop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#dpPop .dp,#askPop .dp{background:var(--card);color:var(--fg,inherit);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dpg button{min-height:38px;padding:2px;min-width:0}.dpg span{text-align:center;padding:9px 0;font-size:14px}
.dpg button.sel{outline:2px solid var(--ok);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:44px;padding:6px 8px}
.chips button.on{background:var(--btn);color:var(--pri-fg);border-color:var(--btn)}
.sch{border-top:1px solid var(--line);padding:10px 0}
.sw{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dp .app{padding:8px 0}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin:6px 0}
.hist button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 0 2px;background:none;border:0;border-radius:6px;font-size:12px;color:var(--mute)}
.hist button i{display:block;width:70%;background:var(--pri);opacity:.45;border-radius:5px 5px 0 0;min-height:2px}
.hist button.on i{opacity:1}.hist button.on{color:var(--fg);font-weight:700;background:var(--chip)}
.scr{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:200px;display:grid;place-items:center}
.scr img{display:block;width:100%;max-height:75vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scr img:not([src]){display:none}
.scr.view img{touch-action:auto}
.scr-msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;text-align:center;pointer-events:none}
.scr-msg:empty{display:none}
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(59,130,246,.6);pointer-events:none;animation:tp .5s forwards}
@keyframes tp{to{transform:scale(1.8);opacity:0}}
.bulk{position:sticky;bottom:8px;background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);margin-top:8px}
.app input[type=checkbox]{flex:none}label.app{cursor:pointer}
.map{position:relative;height:260px;border-radius:10px;overflow:hidden;background:var(--chip);touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px}
.map .layer{position:absolute;inset:0}.map img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map svg{position:absolute;overflow:visible}.map circle{cursor:pointer}
.map .mz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.map .mz button{min-height:36px;width:36px;padding:0;background:var(--card)}
.map .attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);color:#333;font-size:11px;padding:1px 5px}.map .attr a{color:#333}
#ear{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(380px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);color:var(--fg);border:2px solid var(--warn);border-radius:12px;padding:8px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:20}
.sos{border:2px solid var(--bad)}
.ovk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.ovk .card{margin:0}
.ovk .nm{display:flex;align-items:center;gap:8px}.ovk .sw{width:12px;height:12px;border-radius:50%;flex:none}
.ovb{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}.ovb>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ovb .g{display:flex;gap:2px;align-items:flex-end;height:104px;width:100%;justify-content:center}.ovb .g i{flex:1;max-width:14px;border-radius:3px 3px 0 0;min-height:2px}
.map .pin{position:absolute;transform:translate(-50%,-100%);background:var(--card);color:var(--fg);border:2px solid;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
#saveBar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--bad,#b91c1c);color:#fff}
#saveBar button{margin-left:auto}
body.sb #toast{bottom:76px}
.row.tm{flex-wrap:nowrap}.row.tm input[type=time]{width:7em;padding:8px 6px}
a{color:var(--pri)}
a.lnkbtn{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:9px 14px;text-decoration:none}
#toast{position:fixed;z-index:80;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// One page for both: served by the child phone on the LAN (/api/...) and by the relay worker (/c/<id>/...).
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "kg.kids";
// App mode: running inside the KidGuard parent Android app (WebView + local proxy, bridge window.KGApp).
const APP = !!window.KGApp;
const b64u = s => btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const kgCall = (m, ...a) => { try { return window.KGApp[m](...a); } catch { return null; } };
const load = () => {
  try {
    // the app's WebView origin changes with the proxy port, so prefer the app's own copy when the bridge offers one
    const fromApp = APP && typeof window.KGApp.getKids === "function" ? kgCall("getKids") : null;
    return JSON.parse(fromApp || localStorage.getItem(KEY) || "[]");
  } catch { return []; }
};
const save = k => {
  try { localStorage.setItem(KEY, JSON.stringify(k)); } catch {}
  if (APP) kgCall("setKids", JSON.stringify(k.filter(x => x.target).map(x => ({ name: x.name, target: x.target, via: x.via, id: x.id, token: x.token }))));
};
let kids = load(), cur = null, st = null, pendingRules = null, timer = null, edit = null, tab = "home", lastErr = "", viewDay = null, histDays = null, cachedAt = 0, seenAt = 0, answered = new Set(), histSel = -1, lastNet = false;
const onLan = () => !location.pathname.startsWith("/c/") && !isRelayOrigin;
let isRelayOrigin = false;
// v0.7 basic mode: no Device Owner (old phones without mode = owner as before)
const isBasic = () => !!(st && st.mode && st.mode !== "owner");
const needOwner = (what = "mục này") => `<p class="mute">${ic("lock")} Cần Device Owner: máy con đang ở chế độ cơ bản nên ${what} không có tác dụng.</p>`;

const ic = n => `<svg class="si" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const dot = c => `<i class="dot ${c}"></i>`;
const noEmoji = s => String(s ?? "").replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "").replace(/^\s+/, "");
const TI = { ok: ["circle-check", "var(--ok)"], err: ["circle-x", "var(--bad)"], warn: ["triangle-alert", "var(--warn)"], send: ["send", ""] };
function toast(m) { const t = $("#toast"); const k = /^(ok|err|warn|send)\|/.exec(m); t.innerHTML = k ? `<span style="color:${TI[k[1]][1]}">${ic(TI[k[1]][0])}</span> ${esc(m.slice(k[0].length))}` : esc(m); t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2500); }
function fmt(ms) { if (ms < 0) return "—"; const m = Math.round(ms / 60000); return m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ " + (m % 60 ? m % 60 + " phút" : ""); }

function errVi(raw, vi) {
  let m = vi || ERR_VI[raw];
  if (!m) { const h = /^HTTP (\d+)$/.exec(raw); m = h ? "Máy chủ lỗi (" + h[1] + "), thử lại sau" : raw; }
  const e = new Error(m); e.raw = raw; e.net = raw === "net"; return e;
}
async function call(k, path, method = "GET", body) {
  // app mode: a cached snapshot means the phone/relay is unreachable, so commands cannot be delivered
  if (APP && method !== "GET" && viewDay && k === cur) throw new Error("đang xem lịch sử, chỉ xem");
  if (APP && method !== "GET" && cachedAt && k === cur) throw new Error("đang mất kết nối, chưa gửi được");
  let r;
  try { r = await fetch(base(k) + path, { method, headers: { "X-KG-Token": k.token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw errVi("net", APP ? "mất kết nối" : null); }
  if (APP && method === "GET" && path === "/state") cachedAt = +r.headers.get("X-KG-Cached") || 0;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw errVi(APP && j.error === "offline" ? "offline" : j.error || ("HTTP " + r.status));
  return j;
}

// --- boot ---------------------------------------------------------------
async function boot() {
  if (navLvl()) try { history.replaceState(null, ""); } catch {}   // a reload keeps the old entry state
  if (APP) return appBoot();
  // a link from the child: #c=<id>&k=<token>&n=<name>
  const h = new URLSearchParams(location.hash.slice(1));
  // QR from the child's screen: #pair=<6 digits> prefills the code; drop the hash so a reload does not reuse it
  const pc = /^\d{6}$/.test(h.get("pair") || "") ? h.get("pair") : "";
  if (h.has("pair")) history.replaceState(null, "", location.pathname + location.search);
  if (h.get("c") && h.get("k")) {
    isRelayOrigin = true;
    const k = { id: h.get("c"), token: h.get("k"), name: h.get("n") || "Con", via: "relay" };
    kids = kids.filter(x => !(x.id === k.id && x.via === "relay")).concat(k); save(kids);
    history.replaceState(null, "", location.pathname);
    return open(k);
  }
  let hello = null;
  try { const r = await fetch("/api/hello"); if (r.ok) hello = await r.json(); } catch {}
  if (hello) {  // served by the child itself
    const k = kids.find(x => x.via === "lan" && x.id === hello.id);
    if (k) return open(k);
    return pairScreen(hello, undefined, pc);
  }
  isRelayOrigin = true;
  const relayKids = kids.filter(k => k.via === "relay");
  if (relayKids.length === 1) return open(relayKids[0]);
  listScreen(relayKids);
}

// weekly report: per kid, last 7 completed days from state.history (the phone keeps no more), top apps, requests from the log
function ovReport(D) {
  const wk = 7 * 864e5, now = Date.now();
  return D.map((d, i) => {
    const s = d.st, head = `<div class="sch"><div class="nm"><i class="sw" style="background:${KC[i % KC.length]}"></i><b>${esc(d.k.name)}</b></div>`;
    if (!s) return head + `<div class="mute">${d.err ? esc(d.err) : "Đang tải…"}</div></div>`;
    const h = s.history || [], cur7 = h.slice(0, 7), prev7 = h.slice(7, 14), sum = a => a.reduce((x, y) => x + (+y.ms || 0), 0);
    const tot = sum(cur7), avg = cur7.length ? tot / cur7.length : 0;
    const top = new Map(); cur7.forEach(x => (x.top || []).forEach(t => { const o = top.get(t.pkg) || { label: t.label || t.pkg, ms: 0 }; o.ms += +t.ms || 0; top.set(t.pkg, o); }));
    const tops = [...top.values()].filter(t => t.ms > 0).sort((a, b) => b.ms - a.ms).slice(0, 3);
    const reqs = (s.log || []).filter(l => now - l.t < wk && /xin thêm/.test(l.m)).length;
    const pt = prev7.length >= 7 ? sum(prev7) : 0, cmp = pt ? ` · ${tot >= pt ? "+" : "−"}${Math.round(Math.abs(tot - pt) / pt * 100)}% so với 7 ngày trước` : "";
    return head + `<div>${cur7.length} ngày qua (trừ hôm nay): <b>${fmt(tot)}</b> · trung bình <b>${fmt(avg)}</b>/ngày<span class="mute">${cmp}</span></div>
      <div class="mute">${tops.length ? "Dùng nhiều nhất: " + tops.map(t => esc(t.label) + " " + fmt(t.ms)).join(", ") : "Chưa có dữ liệu app"}</div>
      <div class="mute">${ic("hand")} Xin thêm giờ: ${reqs} lần (theo nhật ký)</div></div>`;
  }).join("");
}
function ovMap(pins) {
  const box = $("#map"); if (!box) return;
  const w = box.clientWidth || 340, h = 260, S = 256 * 2 ** mv.z, left = mv.fx * S - w / 2, top = mv.fy * S - h / 2, n = 2 ** mv.z;
  let tiles = "";
  for (let ty = Math.floor(top / 256); ty <= Math.floor((top + h) / 256); ty++) for (let tx = Math.floor(left / 256); tx <= Math.floor((left + w) / 256); tx++) {
    if (ty < 0 || ty >= n) continue;
    tiles += `<img alt="" draggable="false" src="https://tile.openstreetmap.org/${mv.z}/${((tx % n) + n) % n}/${ty}.png" style="left:${Math.round(tx * 256 - left)}px;top:${Math.round(ty * 256 - top)}px">`;
  }
  const xy = pins.map(p => [wx(p.lng) * S - left, wy(p.lat) * S - top]);
  box.innerHTML = `<div class="layer" id="mlayer">${tiles}<svg width="${w}" height="${h}" style="left:0;top:0">${xy.map((q, i) => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="8" fill="${pins[i].c}" stroke="#fff" stroke-width="3"/>`).join("")}</svg>
    ${xy.map((q, i) => `<span class="pin" style="left:${q[0].toFixed(0)}px;top:${(q[1] - 12).toFixed(0)}px;border-color:${pins[i].c}">${esc(pins[i].name)}</span>`).join("")}</div>
    <div class="mz"><button id="mzi" aria-label="Phóng to">${ic("plus")}</button><button id="mzo" aria-label="Thu nhỏ">${ic("minus")}</button></div><div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>`;
  $("#mzi").onclick = () => { mv.z = Math.min(18, mv.z + 1); ovMap(pins); };
  $("#mzo").onclick = () => { mv.z = Math.max(2, mv.z - 1); ovMap(pins); };
}

    <div id="list"></div><p class="mute">${ic("lightbulb")} "Luôn cho phép": không bị khoá bởi giới hạn ngày, giờ ngủ, tạm dừng, và không tính vào giờ dùng. Điện thoại, Cài đặt và màn hình chính luôn được giữ (app hệ thống được bảo vệ không nằm trong danh sách và bị bỏ qua khi chọn hàng loạt).</p></div>

      ${sel.limOpen ? `<div class="row" style="margin-top:6px"><input id="f-lim" type="number" min="1" max="1440" step="5" inputmode="numeric" placeholder="phút/ngày" style="width:8em"><button id="limOk" class="pri" ${dis}>${ic("circle-check")} Áp dụng</button></div>` : ""}`;
    const clr = p => { edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p]; };
    const apply = async (msg, fn) => {
      const pk = [...sel.set].filter(p => { const a = st.apps.find(x => x.pkg === p); return a && !a.protected; });

      else if (a === "unblock") apply("Đã bỏ chặn", p => { edit.blocked = edit.blocked.filter(v => v !== p); });
      else if (a === "allow") apply("Luôn cho phép", p => { clr(p); edit.allow.push(p); });
      else if (a === "unlim") apply("Đã bỏ giới hạn", p => { delete edit.appMin[p]; });
      else if (a === "approve") apply("Đã duyệt", p => { if (!edit.approved.includes(p)) edit.approved.push(p); });

    });
    if ($("#limOk")) $("#limOk").onclick = () => {

      apply("Giới hạn " + m + " phút", p => { edit.blocked = edit.blocked.filter(v => v !== p); edit.allow = edit.allow.filter(v => v !== p); edit.appMin[p] = m; });
    };

  const draw = () => {
    const vis = visible();
    $("#list").innerHTML = vis.map(x => {

      if (sel.on) return `<label class="app"><input type="checkbox" data-c="${esc(x.pkg)}" ${sel.set.has(x.pkg) ? "checked" : ""}>${icon(x)}${info}</label>`;
      return `<div class="app">${icon(x)}${info}
      ${nw ? `<button class="pri" data-ok="${esc(x.pkg)}">${ic("circle-check")} Cho phép</button>` : ""}
      <select data-p="${esc(x.pkg)}">
        <option value="normal" ${m === "normal" ? "selected" : ""}>Bình thường</option>
        ${[15, 30, 45, 60, 90, 120].map(n => `<option value="${n}" ${m === "limit" && edit.appMin[x.pkg] === n ? "selected" : ""}>${n} phút/ngày</option>`).join("")}
        ${m === "limit" && ![15, 30, 45, 60, 90, 120].includes(edit.appMin[x.pkg]) ? `<option value="${edit.appMin[x.pkg]}" selected>${edit.appMin[x.pkg]} phút/ngày</option>` : ""}
        <option value="block" ${m === "block" ? "selected" : ""}>Chặn</option>
        <option value="allow" ${m === "allow" ? "selected" : ""}>Luôn cho phép</option>
      </select></div>`;
    }).join("") || `<div class="empty"><span class="e">${ic("circle-dashed")}</span>Không có app nào</div>`;
    $("#list").querySelectorAll("[data-ok]").forEach(bt => bt.onclick = () => { edit.approved.push(bt.dataset.ok); changed(); draw(); toast("ok|Đã cho phép"); });
    $("#list").querySelectorAll("[data-c]").forEach(c => c.onchange = () => { c.checked ? sel.set.add(c.dataset.c) : sel.set.delete(c.dataset.c); drawBar(); });
    $("#list").querySelectorAll("select").forEach(s => s.onchange = () => {
      const p = s.dataset.p, v = s.value;
      edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p];
      if (v === "block") edit.blocked.push(p); else if (v === "allow") edit.allow.push(p); else if (v !== "normal") edit.appMin[p] = +v;
      changed();
    });
    drawBar();
  };
  $("#f-q").oninput = draw;
  $("#selTog").onclick = () => { sel.on = !sel.on; sel.set.clear(); sel.limOpen = false; appsTab(b); };
  b.querySelectorAll("#flt [data-f]").forEach(x => x.onclick = () => { sel.f = x.dataset.f; appsTab(b); });
  if ($("#selAll")) $("#selAll").onclick = () => { visible().forEach(x => sel.set.add(x.pkg)); draw(); };
  if ($("#selNone")) $("#selNone").onclick = () => { sel.set.clear(); draw(); };
  draw(); cleanWire(b);
}

// v0.8 "Dọn máy": hide preinstalled bloat (owner), clear an app's data (owner, Android 9+), heaviest apps (both modes)
let cleanAll = false;
const mbTxt = m => m >= 1024 ? (m / 1024).toFixed(1).replace(".", ",") + " GB" : m + " MB";
function cleanHtml() {
  const heavy = (st.apps || []).filter(x => x.mb > 0).sort((a, b) => b.mb - a.mb).slice(0, 8);
  const pre = st.preinstalled || [], owner = !isBasic() && st.owner !== false;
  const hid = p => edit.hidden.includes(p);
  const list = cleanAll ? pre : pre.filter(x => x.suggest || hid(x.pkg) || x.hidden);
  const nHid = pre.filter(x => hid(x.pkg)).length;
  return `<div class="card"><h2>${ic("sparkles")} Dọn máy cho nhẹ</h2>
    ${owner && st.preinstalled ? `<p class="mute">${ic("eye-off")} Ẩn app cài sẵn của hãng mà con không dùng: app bị ẩn không chạy nền, không tốn RAM, không tự cập nhật. Bỏ tích là hiện lại ngay, không mất gì. Đang ẩn: <b>${nHid}</b>.</p>
      <div id="pre">${list.map(x => `<label class="app"><input type="checkbox" data-h="${esc(x.pkg)}" ${hid(x.pkg) ? "checked" : ""}><div class="nm"><b>${esc(x.label)}</b><span class="mute">${esc(x.pkg)}${x.mb ? " · " + mbTxt(x.mb) : ""}${x.suggest ? `<span class="tag warn">nên ẩn</span>` : ""}</span></div></label>`).join("") || `<p class="mute">Không thấy app cài sẵn nào nên ẩn.</p>`}</div>
      <div class="row" style="margin-top:8px">${pre.some(x => x.suggest && !hid(x.pkg)) ? `<button id="hideSug">${ic("eye-off")} Ẩn hết app "nên ẩn"</button>` : ""}<button id="preAll">${cleanAll ? "Chỉ hiện app nên ẩn" : "Xem tất cả app hệ thống (" + pre.length + ")"}</button></div>`
      : owner ? `<p class="mute">${ic("hourglass")} Máy con chưa gửi danh sách app cài sẵn (cần KidGuard 0.8 trở lên).</p>` : needOwner("ẩn app cài sẵn của hãng")}
    <h2 style="margin-top:14px">${ic("hard-drive")} App nặng nhất</h2>
    ${heavy.length ? heavy.map(x => `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${mbTxt(x.mb)}</span></div>${owner && !x.protected ? `<button data-clr="${esc(x.pkg)}" class="bad">${ic("trash-2")} Xoá dữ liệu</button>` : ""}</div>`).join("")
      : `<p class="mute">Chưa có số liệu dung lượng (cần quyền "Truy cập dữ liệu sử dụng" trên máy con, KidGuard 0.8+).</p>`}
    <p class="mute">${ic("lightbulb")} ${owner ? "Xoá dữ liệu = app về như mới cài (mất đăng nhập, tin nhắn, file lưu trong app). " : "Trên máy con: Cài đặt → Ứng dụng → chọn app → Gỡ cài đặt / Tắt. "}Không có nút "dọn RAM": Android tự quản lý, tắt app chạy nền chỉ làm nó mở lại và tốn pin hơn.</p></div>`;
}
function cleanWire(b) {
  b.querySelectorAll("[data-h]").forEach(c => c.onchange = () => {
    const p = c.dataset.h; edit.hidden = edit.hidden.filter(x => x !== p); if (c.checked) edit.hidden.push(p);
    changed(); toast("ok|" + (c.checked ? "Đã ẩn" : "Đã hiện lại")); setTimeout(refresh, 1500);
  });
  if ($("#hideSug")) $("#hideSug").onclick = async () => {
    const add = (st.preinstalled || []).filter(x => x.suggest && !edit.hidden.includes(x.pkg));
    if (!(await ask(`Ẩn ${add.length} app cài sẵn nên ẩn?\n\n${add.map(x => x.label).join(", ")}\n\nBỏ tích là hiện lại.`, "Ẩn"))) return;
    add.forEach(x => edit.hidden.push(x.pkg)); changed(); toast("ok|Đã ẩn " + add.length + " app"); appsTab(b); setTimeout(refresh, 1500);
  };
  if ($("#preAll")) $("#preAll").onclick = () => { cleanAll = !cleanAll; appsTab(b); };
  b.querySelectorAll("[data-clr]").forEach(x => x.onclick = () => {
    const a = (st.apps || []).find(y => y.pkg === x.dataset.clr); if (!a) return;
    cmd({ type: "clearData", pkg: a.pkg }, "Đã xoá dữ liệu " + a.label,
      [`Xoá toàn bộ dữ liệu của ${a.label}?\n\nApp sẽ như mới cài: mất đăng nhập và mọi thứ lưu trong app. Không hoàn tác được.`, "Xoá", true]).then(() => setTimeout(refresh, 2000));
  });
}

// warning under a time range (bedtime / schedule) that would never block anything
function timeWarn(x, on, sch) {
  if (!on) return "";
  const m = [];
  if (!x.start || !x.end) m.push("Chưa chọn đủ giờ bắt đầu và kết thúc, luật này không có tác dụng");
  else if (x.start === x.end) m.push("Giờ bắt đầu và kết thúc trùng nhau, luật này không có tác dụng");

  return m.map(t => `<div class="alert warn" style="margin-top:8px">${ic("triangle-alert")} ${t}</div>`).join("");
}

  for (let ty = Math.floor(top / 256); ty <= Math.floor((top + h) / 256); ty++) for (let tx = Math.floor(left / 256); tx <= Math.floor((left + w) / 256); tx++) {
    if (ty < 0 || ty >= n) continue;
    tiles += `<img alt="" draggable="false" src="https://tile.openstreetmap.org/${mv.z}/${((tx % n) + n) % n}/${ty}.png" style="left:${Math.round(tx * 256 - left)}px;top:${Math.round(ty * 256 - top)}px">`;
  }
  const xy = pts.map(p => [wx(p[2]) * S - left, wy(p[1]) * S - top]);
  const line = xy.map(q => q.map(v => v.toFixed(1)).join(",")).join(" ");
  const last = pts.length - 1;
  const dots = xy.map((q, i) => `<circle data-i="${i}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i === 0 || i === last ? 8 : 5}" fill="${i === 0 ? "#16a34a" : i === last ? "#dc2626" : "#2563eb"}" stroke="#fff" stroke-width="2"/>`).join("");
  const zs = ((edit || st.rules || {}).zones || []).filter(zoneOk).map(z => {
    const mpp = 156543.03392 * Math.cos(+z.lat * Math.PI / 180) / 2 ** mv.z, cx = wx(+z.lng) * S - left, cy = wy(+z.lat) * S - top;
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${Math.max(3, (z.r || 150) / mpp).toFixed(1)}" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2" style="pointer-events:none"/><text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#166534" stroke="#fff" stroke-width="3" paint-order="stroke" style="pointer-events:none">${esc(z.name)}</text>`;
  }).join("");
  box.innerHTML = `<div class="layer" id="mlayer">${tiles}<svg width="${w}" height="${h}" style="left:0;top:0">${zs}<polyline points="${line}" fill="none" stroke="#2563eb" stroke-width="3" stroke-opacity=".7" stroke-linejoin="round"/>${dots}</svg></div>
    <div class="mz"><button id="mzi" aria-label="Phóng to">${ic("plus")}</button><button id="mzo" aria-label="Thu nhỏ">${ic("minus")}</button></div><div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>`;
  $("#mzi").onclick = () => { mv.z = Math.min(18, mv.z + 1); drawMap(pts); };
  $("#mzo").onclick = () => { mv.z = Math.max(2, mv.z - 1); drawMap(pts); };
  box.querySelectorAll("circle[data-i]").forEach(c => c.onclick = () => { if (box._moved) return; const p = pts[+c.dataset.i]; $("#mapInfo").textContent = `${hhmm(p[0])} · sai số ±${Math.round(p[3] || 0)} m`; });
}
function mapDrag(pts, draw = () => drawMap(pts)) {
  const box = $("#map"); let d = null;
  box.onpointerdown = e => { if (e.target.closest("button,a")) return; d = { x: e.clientX, y: e.clientY, id: e.pointerId }; box._moved = false; };
  box.onpointermove = e => {
    if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!box._moved && Math.hypot(dx, dy) > 5) { box._moved = true; try { box.setPointerCapture(d.id); } catch {} }
    if (box._moved) { const l = $("#mlayer"); if (l) l.style.transform = `translate(${dx}px,${dy}px)`; }
  };
  const end = e => {
    if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; d = null;
    if (box._moved) { const S = 256 * 2 ** mv.z; mv.fx -= dx / S; mv.fy -= dy / S; draw(); setTimeout(() => box._moved = false, 50); }
  };
  box.onpointerup = end; box.onpointercancel = end;
}

  $("#forget").onclick = async () => {
    if (!(await ask(`${APP ? "Xoá" : "Quên"} máy “${cur.name}” ${APP ? "khỏi app" : "ở trình duyệt này"}?\n\nMuốn xem lại phải ghép lại bằng mã trên máy con.`, APP ? "Xoá" : "Quên", true))) return;
    screenStop(); kids = kids.filter(x => x !== cur); save(kids); cur = null; clearInterval(timer); boot(); navDown(0); };
  if ($("#f-au")) $("#f-au").onchange = e => { if (!edit) return; edit.autoUpdate = e.target.checked; changed(); };
  if ($("#updNow")) $("#updNow").onclick = () => cmd({ type: "update" }, "Đã gửi: máy con kiểm tra bản mới", ["Cho máy con kiểm tra và cài bản KidGuard mới nhất từ GitHub? KidGuard tắt vài giây khi cài.", "Cập nhật"]).then(() => setTimeout(refresh, 4000));
  $("#release").onclick = async () => {
    await cmd({ type: "release" }, "Đã gỡ quản lý", ["Gỡ quyền quản lý: máy con sẽ hết mọi giới hạn và KidGuard không điều khiển được nữa.", "Gỡ quản lý", true, "GỠ"]);
  };
}

boot();
</script>
</body>
</html>
