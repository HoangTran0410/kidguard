<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>KidGuard</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri-fg:#fff;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e5e7eb;--mute:#9ca3af;--line:#263041;--pri:#3b82f6;--chip:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:30px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.app{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:9px;background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1;min-width:0}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-left:4px}
.tag.bad{background:#fee2e2;color:#991b1b}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.on{background:var(--ok)}
.err{color:var(--bad)}
iframe{width:100%;height:220px;border:0;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button.on{background:var(--pri);color:var(--pri-fg)}
code{word-break:break-all;font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
// One page for both: served by the child phone on the LAN (/api/...) and by the relay worker (/c/<id>/...).
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "kg.kids";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } };
const save = k => { try { localStorage.setItem(KEY, JSON.stringify(k)); } catch {} };
let kids = load(), cur = null, st = null, pendingRules = null, timer = null, edit = null, tab = "home", lastErr = "";
const onLan = () => !location.pathname.startsWith("/c/") && !isRelayOrigin;
let isRelayOrigin = false;

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2500); }
function fmt(ms) { if (ms < 0) return "—"; const m = Math.round(ms / 60000); return m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ " + (m % 60 ? m % 60 + " phút" : ""); }
function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + " giây trước" : s < 3600 ? Math.round(s / 60) + " phút trước" : Math.round(s / 3600) + " giờ trước"; }
const REASON = { blocked: "chặn", appLimit: "hết giờ app", daily: "hết giờ hôm nay", bedtime: "giờ ngủ", paused: "tạm dừng" };

function base(k) { return k.via === "lan" ? "/api" : "/c/" + encodeURIComponent(k.id); }
async function call(k, path, method = "GET", body) {
  const r = await fetch(base(k) + path, { method, headers: { "X-KG-Token": k.token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// --- boot ---------------------------------------------------------------
async function boot() {
  // a link from the child: #c=<id>&k=<token>&n=<name>
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c") && h.get("k")) {
    isRelayOrigin = true;
    const k = { id: h.get("c"), token: h.get("k"), name: h.get("n") || "Con", via: "relay" };
    kids = kids.filter(x => !(x.id === k.id && x.via === "relay")).concat(k); save(kids);
    history.replaceState(null, "", location.pathname);
    return open(k);
  }
  let hello = null;
  try { const r = await fetch("/api/hello"); if (r.ok) hello = await r.json(); } catch {}
  if (hello) {  // served by the child itself
    const k = kids.find(x => x.via === "lan" && x.id === hello.id);
    if (k) return open(k);
    return pairScreen(hello);
  }
  isRelayOrigin = true;
  const relayKids = kids.filter(k => k.via === "relay");
  if (relayKids.length === 1) return open(relayKids[0]);
  listScreen(relayKids);
}

function pairScreen(hello) {
  $("#app").innerHTML = `<h1>KidGuard</h1><div class="card">
    <h2>Ghép với máy của con</h2>
    ${hello.pairing ? `<p>Nhập mã 6 số đang hiện trên máy của con.</p>
    <div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:24px;width:9em;letter-spacing:.2em">
    <input id="nm" placeholder="Tên con" value="Con" style="width:8em"><button class="pri" id="go">Ghép</button></div><p class="err" id="e"></p>`
    : `<p>Máy của con chưa mở ghép. Trên máy con: mở app KidGuard → <b>Ghép thêm máy của bố mẹ</b> (cần PIN của bố mẹ nếu đã đặt).</p><button onclick="location.reload()">Thử lại</button>`}
    ${hello.owner ? "" : `<p class="err">Máy con chưa có quyền Device Owner: chạy setup.sh (xem README).</p>`}
  </div>`;
  const go = $("#go"); if (!go) return;
  go.onclick = async () => {
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("#code").value }) });
      const j = await r.json();
      if (!r.ok) throw new Error("Sai mã, thử lại");
      const k = { id: j.id, token: j.token, name: $("#nm").value || "Con", via: "lan" };
      kids = kids.filter(x => !(x.id === k.id && x.via === "lan")).concat(k); save(kids); open(k);
    } catch (e) { $("#e").textContent = e.message; }
  };
}

function listScreen(list) {
  $("#app").innerHTML = `<h1>KidGuard</h1>` + (list.length ? list.map((k, i) =>
    `<div class="card row"><b class="sp">${esc(k.name)}</b><button class="pri" data-i="${i}">Mở</button></div>`).join("")
    : `<div class="card"><p>Chưa có máy nào. Mở link "điều khiển từ xa" từ trang của con (khi ở nhà, tab Cài đặt) để thêm.</p></div>`);
  $("#app").querySelectorAll("[data-i]").forEach(b => b.onclick = () => open(list[+b.dataset.i]));
}

// --- one child ------------------------------------------------------------
async function open(k) { cur = k; st = null; edit = null; render(); await refresh(); clearInterval(timer); timer = setInterval(refresh, k.via === "lan" ? 4000 : 8000); }

async function refresh() {
  if (!cur) return;
  try {
    const j = await call(cur, "/state");
    // LAN: the state itself; relay: {state, rules (sent, not yet taken), seen}
    st = j.state !== undefined ? j.state : j;
    pendingRules = j.state !== undefined ? j.rules : null;
    lastErr = "";
  } catch (e) {
    lastErr = e.message;
    if (/not paired/.test(e.message)) { kids = kids.filter(x => x !== cur); save(kids); toast("Thiết bị này đã bị huỷ ghép"); return setTimeout(boot, 1000); }
  }
  if (!edit && st && st.rules) edit = structuredClone(pendingRules && pendingRules.rev > st.rules.rev ? pendingRules : st.rules);
  // redraw the tab only when what it shows changed and nobody is using a control (icons would reload, a select would close)
  const sig = st ? JSON.stringify([tab, st.rules && st.rules.rev, st.apps.map(a => [a.suspended, a.blocked, Math.floor(a.ms / 60000)]),
    st.location && st.location.t, (st.log || []).length, Math.floor(st.usedMs / 60000), lastErr]) : lastErr;
  const busy = document.activeElement && /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (sig !== lastSig && !busy) { lastSig = sig; render(); } else updateLive();
}
let lastSig = "";

let saveT = null;
function changed() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { const r = await call(cur, "/rules", "PUT", edit); if (cur.via === "lan") edit = r; delete edit.pin; toast(cur.via === "lan" ? "Đã lưu" : "Đã gửi, máy con nhận trong ~20 giây"); }
    catch (e) { toast("Lỗi: " + e.message); }
  }, 500);
}

async function cmd(c, okMsg) {
  try { const r = await call(cur, "/cmd", "POST", c); toast(okMsg || "Đã gửi"); return r; } catch (e) { toast("Lỗi: " + e.message); }
}

function render() {
  if (!cur) return;
  const a = $("#app");
  const focus = document.activeElement && document.activeElement.id;   // keep the field being typed in
  if (focus && /^(f-|msg|relay)/.test(focus)) { updateLive(); return; }
  const online = st && Date.now() - st.t < (cur.via === "lan" ? 30000 : 120000);
  a.innerHTML = `
  <div class="row"><h1 class="sp">${esc(cur.name)}</h1>${kids.length > 1 || cur.via === "relay" ? `<button id="back">Danh sách</button>` : ""}</div>
  <div class="card" id="live"></div>
  <div class="tabs">${[["home", "Hôm nay"], ["apps", "Ứng dụng"], ["rules", "Luật"], ["where", "Vị trí"], ["set", "Cài đặt"]].map(([id, n]) => `<button data-tab="${id}" class="${tab === id ? "on" : ""}">${n}</button>`).join("")}</div>
  <div id="body"></div>`;
  a.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  if ($("#back")) $("#back").onclick = () => { cur = null; clearInterval(timer); listScreen(kids.filter(k => k.via === (onLan() ? "lan" : "relay"))); };
  updateLive();
  const body = $("#body");
  if (!st) { body.innerHTML = `<div class="card mute">${lastErr ? "Không kết nối được: " + esc(lastErr) : "Đang tải…"}</div>`; return; }
  ({ home: homeTab, apps: appsTab, rules: rulesTab, where: whereTab, set: setTab })[tab](body);
}

function updateLive() {
  const el = $("#live"); if (!el) return;
  if (!st) { el.innerHTML = `<span class="mute">${lastErr ? "⚠️ " + esc(lastErr) : "Đang kết nối…"}</span>`; return; }
  const online = Date.now() - st.t < (cur.via === "lan" ? 30000 : 120000);
  const warn = [!st.owner && "Chưa có Device Owner", !st.usageAccess && "Chưa có quyền xem thời gian dùng"].filter(Boolean);
  el.innerHTML = `<div class="row"><span class="dot ${online ? "on" : ""}"></span><b>${online ? "Đang kết nối" : "Mất kết nối"}</b>
    <span class="mute">· cập nhật ${ago(st.t)}</span><span class="sp"></span><span>🔋 ${st.battery}%${st.charging ? "⚡" : ""}</span></div>
    <div class="mute">${esc(st.model)} · Android ${esc(st.android)} · ${st.screenOn ? "màn hình bật" + (st.current ? ": <b>" + esc(st.current) + "</b>" : "") : "màn hình tắt"}</div>
    ${pendingRules && st.rules && pendingRules.rev > st.rules.rev ? `<div class="mute">⏳ Luật mới đang chờ máy con nhận</div>` : ""}
    ${warn.length ? `<div class="err">⚠️ ${warn.join(" · ")}</div>` : ""}`;
}

function homeTab(b) {
  const r = edit || st.rules, limit = r.dailyMin, today = st.day;
  const used = st.usedMs, left = st.leftMs, pct = limit ? Math.min(100, used / (limit * 600)) : 0;
  const pausedLeft = r.pausedUntil - Date.now();
  const blockedNow = st.apps.filter(x => x.suspended);
  b.innerHTML = `
  <div class="card"><h2>Hôm nay</h2>
    <div class="row"><span class="big">${fmt(used)}</span><span class="mute">đã dùng${limit ? " / " + fmt(limit * 60000) + (r.bonus && r.bonus.day === today && r.bonus.min ? " + " + r.bonus.min + " phút thêm" : "") : " (không giới hạn)"}</span></div>
    ${limit ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="mute">Còn ${fmt(left)}</div>` : ""}
    <div class="row" style="margin-top:10px"><button data-bonus="15">+15 phút</button><button data-bonus="30">+30 phút</button><button data-bonus="60">+1 giờ</button>
    ${r.bonus && r.bonus.day === today && r.bonus.min ? `<button data-bonus="0">Bỏ thêm giờ</button>` : ""}</div>
  </div>
  <div class="card"><h2>Ngay bây giờ</h2>
    ${pausedLeft > 0 ? `<p><b>⏸ Đang tạm dừng</b>, còn ${fmt(pausedLeft)} <button id="unpause" class="pri">Mở lại</button></p>` : ""}
    <div class="grid">
      <button data-pause="30">⏸ Dừng 30 phút</button><button data-pause="60">⏸ Dừng 1 giờ</button><button data-pause="morning">⏸ Dừng tới 6h sáng</button>
      <button id="lock">🔒 Khoá màn hình</button><button id="ring">🔔 Đổ chuông</button><button id="loc">📍 Lấy vị trí</button>
    </div>
    <div class="row" style="margin-top:10px"><input id="msg" class="sp" placeholder="Nhắn cho con…" maxlength="300"><button id="send" class="pri">Gửi</button></div>
  </div>
  ${blockedNow.length ? `<div class="card"><h2>Đang khoá (${blockedNow.length})</h2>${blockedNow.slice(0, 50).map(x => `<span class="tag bad">${esc(x.label)}</span>`).join(" ")}</div>` : ""}
  <div class="card"><h2>Dùng nhiều nhất</h2>${st.apps.filter(x => x.ms > 60000).slice(0, 8).map(appRow).join("") || `<span class="mute">Chưa có</span>`}</div>
  <div class="card"><h2>Nhật ký</h2>${(st.log || []).slice(-12).reverse().map(l => `<div class="mute">${new Date(l.t).toLocaleTimeString("vi", { hour: "2-digit", minute: "2-digit" })} · ${esc(l.m)}</div>`).join("") || `<span class="mute">Trống</span>`}</div>`;
  b.querySelectorAll("[data-bonus]").forEach(x => x.onclick = () => {
    const add = +x.dataset.bonus, cur0 = r.bonus && r.bonus.day === today ? r.bonus.min : 0;
    edit.bonus = { day: today, min: add ? cur0 + add : 0 }; changed(); render();
  });
  b.querySelectorAll("[data-pause]").forEach(x => x.onclick = () => {
    let until; if (x.dataset.pause === "morning") { const d = new Date(); if (d.getHours() >= 6) d.setDate(d.getDate() + 1); d.setHours(6, 0, 0, 0); until = d.getTime(); }
    else until = Date.now() + x.dataset.pause * 60000;
    edit.pausedUntil = until; changed(); render();
  });
  if ($("#unpause")) $("#unpause").onclick = () => { edit.pausedUntil = 0; changed(); render(); };
  $("#lock").onclick = () => cmd({ type: "lock" }, "Đã khoá màn hình");
  $("#ring").onclick = () => cmd({ type: "ring" }, "Đang đổ chuông 20 giây");
  $("#loc").onclick = () => cmd({ type: "locate" }, "Đang lấy vị trí, xem tab Vị trí");
  $("#send").onclick = () => { const t = $("#msg").value.trim(); if (!t) return; cmd({ type: "message", text: t }, "Đã nhắn"); $("#msg").value = ""; };
}

function icon(x) {
  const letter = esc((x.label || "?").trim()[0] || "?");
  return cur.via === "lan" ? `<span class="ic"><img src="/api/icon?pkg=${encodeURIComponent(x.pkg)}&k=${encodeURIComponent(cur.token)}" onerror="this.replaceWith('${letter}')"></span>` : `<span class="ic">${letter}</span>`;
}
function appRow(x) {
  return `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${fmt(x.ms)}${x.suspended ? `<span class="tag bad">${REASON[x.blocked] || "khoá"}</span>` : ""}</span></div></div>`;
}

function appsTab(b) {
  const r = edit;
  const mode = p => r.blocked.includes(p) ? "block" : r.allow.includes(p) ? "allow" : r.appMin[p] ? "limit" : "normal";
  b.innerHTML = `<div class="card"><h2>Ứng dụng (${st.apps.length})</h2>
    <input id="f-q" placeholder="Tìm app…" style="width:100%;margin-bottom:6px">
    <div id="list"></div><p class="mute">"Luôn cho phép": không bị khoá bởi giới hạn ngày, giờ ngủ, tạm dừng, và không tính vào giờ dùng. Điện thoại, Cài đặt và màn hình chính luôn được giữ.</p></div>`;
  const draw = () => {
    const q = ($("#f-q").value || "").toLowerCase();
    $("#list").innerHTML = st.apps.filter(x => !x.protected && (!q || x.label.toLowerCase().includes(q) || x.pkg.includes(q))).map(x => {
      const m = mode(x.pkg);
      return `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${fmt(x.ms)} hôm nay${x.suspended ? `<span class="tag bad">${REASON[x.blocked] || "khoá"}</span>` : ""}</span></div>
      <select data-p="${esc(x.pkg)}">
        <option value="normal" ${m === "normal" ? "selected" : ""}>Bình thường</option>
        ${[15, 30, 45, 60, 90, 120].map(n => `<option value="${n}" ${m === "limit" && r.appMin[x.pkg] === n ? "selected" : ""}>${n} phút/ngày</option>`).join("")}
        ${m === "limit" && ![15, 30, 45, 60, 90, 120].includes(r.appMin[x.pkg]) ? `<option value="${r.appMin[x.pkg]}" selected>${r.appMin[x.pkg]} phút/ngày</option>` : ""}
        <option value="block" ${m === "block" ? "selected" : ""}>Chặn</option>
        <option value="allow" ${m === "allow" ? "selected" : ""}>Luôn cho phép</option>
      </select></div>`;
    }).join("");
    $("#list").querySelectorAll("select").forEach(s => s.onchange = () => {
      const p = s.dataset.p, v = s.value;
      r.blocked = r.blocked.filter(x => x !== p); r.allow = r.allow.filter(x => x !== p); delete r.appMin[p];
      if (v === "block") r.blocked.push(p); else if (v === "allow") r.allow.push(p); else if (v !== "normal") r.appMin[p] = +v;
      changed();
    });
  };
  $("#f-q").oninput = draw; draw();
}

function rulesTab(b) {
  const r = edit;
  b.innerHTML = `
  <div class="card"><h2>Giới hạn mỗi ngày</h2>
    <div class="row"><select id="f-daily">${[0, 30, 60, 90, 120, 150, 180, 240, 300].map(n => `<option value="${n}" ${r.dailyMin === n ? "selected" : ""}>${n ? fmt(n * 60000) : "Không giới hạn"}</option>`).join("")}
    ${[0, 30, 60, 90, 120, 150, 180, 240, 300].includes(r.dailyMin) ? "" : `<option selected value="${r.dailyMin}">${fmt(r.dailyMin * 60000)}</option>`}</select></div>
    <p class="mute">Hết giờ thì mọi app (trừ "Luôn cho phép") bị tạm khoá tới 0h.</p></div>
  <div class="card"><h2>Giờ đi ngủ</h2>
    <div class="row"><label class="row"><input type="checkbox" id="f-bed" ${r.bedtime.on ? "checked" : ""}> Bật</label>
    <span class="sp"></span>từ <input type="time" id="f-bs" value="${esc(r.bedtime.start)}"> tới <input type="time" id="f-be" value="${esc(r.bedtime.end)}"></div></div>
  <div class="card"><h2>Chống lách</h2>
    <label class="row"><input type="checkbox" id="f-ni" ${r.noInstall ? "checked" : ""}><span>Chặn cài app mới</span></label>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="f-nd" ${r.noDebug ? "checked" : ""}><span>Chặn Tuỳ chọn nhà phát triển / ADB</span></label>
    <p class="mute">Luôn bật sẵn: chặn gỡ KidGuard, chặn Force stop, chặn đặt lại máy trong Cài đặt, chặn Safe Mode, chặn tạo người dùng, khoá đổi giờ.</p></div>`;
  $("#f-daily").onchange = e => { r.dailyMin = +e.target.value; changed(); };
  $("#f-bed").onchange = e => { r.bedtime.on = e.target.checked; changed(); };
  $("#f-bs").onchange = e => { r.bedtime.start = e.target.value; changed(); };
  $("#f-be").onchange = e => { r.bedtime.end = e.target.value; changed(); };
  $("#f-ni").onchange = e => { r.noInstall = e.target.checked; changed(); };
  $("#f-nd").onchange = e => { r.noDebug = e.target.checked; changed(); };
}

function whereTab(b) {
  const l = st.location;
  b.innerHTML = `<div class="card"><h2>Vị trí</h2>${l ? `
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${l.lng - 0.006},${l.lat - 0.004},${l.lng + 0.006},${l.lat + 0.004}&layer=mapnik&marker=${l.lat},${l.lng}"></iframe>
    <p>${ago(l.t)} · sai số ~${Math.round(l.acc)} m · <a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">Mở Google Maps</a></p>`
    : `<p class="mute">Chưa có vị trí. Bật Vị trí trên máy con rồi bấm Lấy vị trí.</p>`}
    <button id="loc2" class="pri">📍 Lấy vị trí mới</button><p class="mute">Máy con tự gửi vị trí mỗi 15 phút.</p></div>`;
  $("#loc2").onclick = () => cmd({ type: "locate" }, "Đang lấy vị trí…");
}

function setTab(b) {
  const lan = cur.via === "lan";
  b.innerHTML = `
  <div class="card"><h2>Tên</h2><div class="row"><input id="f-name" class="sp" value="${esc(cur.name)}"><button id="saveName">Lưu</button></div></div>
  <div class="card"><h2>PIN của bố mẹ</h2><p class="mute">Cần PIN này để mở ghép thêm máy ngay trên máy con. ${edit.pinHash ? "✅ Đã đặt." : "⚠️ Chưa đặt: con có thể tự ghép trình duyệt của mình."}</p>
    <div class="row"><input id="f-pin" inputmode="numeric" type="password" placeholder="4–8 số" maxlength="8"><button id="savePin">Đặt PIN</button></div></div>
  ${lan ? `<div class="card"><h2>Điều khiển khi khác mạng</h2>
    <p class="mute">Cần một Cloudflare Worker của bạn (miễn phí, xem README). Dán địa chỉ:</p>
    <div class="row"><input id="relay" class="sp" placeholder="https://kidguard.ten-ban.workers.dev" value="${esc(st.relay || "")}"><button id="saveRelay" class="pri">Bật</button></div>
    <div id="relayOut"></div></div>` : `<div class="card"><h2>Kết nối</h2><p class="mute">Qua relay. Lệnh tới máy con trong khoảng 20 giây (màn hình tắt: 60 giây).</p></div>`}
  <div class="card"><h2>Máy đã ghép</h2>
    <div class="grid"><button id="openPair">Mở ghép thêm (10 phút)</button><button id="unpair" class="bad">Huỷ ghép tất cả</button><button id="forget">Quên máy này ở trình duyệt</button></div></div>
  <div class="card"><h2>Gỡ quản lý</h2><p class="mute">Mở lại mọi app, bỏ mọi giới hạn, bỏ quyền Device Owner. Sau đó gỡ KidGuard như app thường.</p>
    <button id="release" class="bad">Gỡ quyền quản lý…</button></div>`;
  $("#saveName").onclick = () => { cur.name = $("#f-name").value || "Con"; save(kids); render(); };
  $("#savePin").onclick = () => { const p = $("#f-pin").value; if (!/^\d{4,8}$/.test(p)) return toast("PIN 4–8 số"); edit.pin = p; edit.pinHash = "set"; changed(); };
  if (lan) $("#saveRelay").onclick = async () => {
    const url = $("#relay").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\//.test(url)) return toast("Cần địa chỉ https://");
    const r = await cmd({ type: "relay", url }, "Đã bật");
    if (r && r.token) {
      const link = `${url}/#c=${encodeURIComponent(r.id)}&k=${encodeURIComponent(r.token)}&n=${encodeURIComponent(cur.name)}`;
      $("#relayOut").innerHTML = `<p>Mở link này trên điện thoại bố mẹ (lưu lại, đừng gửi cho ai):</p><code>${esc(link)}</code>
        <div class="row" style="margin-top:8px"><button id="copy">Chép link</button><a href="${esc(link)}" target="_blank" rel="noopener"><button>Mở</button></a></div>`;
      $("#copy").onclick = () => { navigator.clipboard?.writeText(link).then(() => toast("Đã chép"), () => toast("Chép tay giúp nhé")); };
    }
  };
  $("#openPair").onclick = () => cmd({ type: "openPairing" }, "Mã ghép đang hiện trên máy con");
  $("#unpair").onclick = async () => { if (!confirm("Huỷ ghép mọi máy bố mẹ? Phải ghép lại bằng mã trên máy con (cần PIN).")) return; await cmd({ type: "unpairAll" }); };
  $("#forget").onclick = () => { kids = kids.filter(x => x !== cur); save(kids); cur = null; clearInterval(timer); boot(); };
  $("#release").onclick = async () => {
    if (prompt('Gõ "GO" để gỡ quản lý khỏi máy con') !== "GO") return;
    await cmd({ type: "release" }, "Đã gỡ quản lý");
  };
}

boot();
</script>
</body>
</html>
