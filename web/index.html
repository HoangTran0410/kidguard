<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidGuard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KidGuard</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--stroke:#e2e8f0;--stroke2:#cbd5e1;--text:#0f172a;--sub:#64748b;--primary:#2563eb;--accent:#2563eb;--tint:#dbeafe;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--track:#e2e8f0;--scrim:rgba(2,6,23,.45);--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);--tbg:12%;
/* old names, kept as aliases */
--fg:var(--text);--mute:var(--sub);--line:var(--stroke);--pri:var(--accent);--btn:var(--primary);--pri-fg:#fff;--bad:var(--danger);--chip:#f1f5f9;--bad-bg:#fee2e2;--bad-fg:#991b1b;--ok-bg:#dcfce7;--ok-fg:#166534;--warn-bg:#fef3c7;--warn-fg:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--card:#1e293b;--stroke:#334155;--stroke2:#475569;--text:#f1f5f9;--sub:#94a3b8;--primary:#3b82f6;--accent:#93c5fd;--tint:rgba(30,58,138,.55);--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--track:#334155;--scrim:rgba(2,6,23,.65);--shadow:none;--tbg:20%;--chip:#273449;--bad-bg:#3b1519;--bad-fg:#fca5a5;--ok-bg:#12301d;--ok-fg:#86efac;--warn-bg:#3a2a0b;--warn-fg:#fcd34d}}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--stroke:#334155;--stroke2:#475569;--text:#f1f5f9;--sub:#94a3b8;--primary:#3b82f6;--accent:#93c5fd;--tint:rgba(30,58,138,.55);--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--track:#334155;--scrim:rgba(2,6,23,.65);--shadow:none;--tbg:20%;--chip:#273449;--bad-bg:#3b1519;--bad-fg:#fca5a5;--ok-bg:#12301d;--ok-fg:#86efac;--warn-bg:#3a2a0b;--warn-fg:#fcd34d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{min-height:100vh}
/* plain screens (pair, add, list, pin gate): one centred column */
.solo{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
h2{font-size:16px;margin:0 0 10px;color:var(--text);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2>.si{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:18px;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute,.sub{color:var(--sub);font-size:13px}
.lab{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sub);text-transform:uppercase}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sub);margin:22px 4px 8px;text-transform:uppercase}
.sec:first-child{margin-top:4px}
.big{font-size:38px;font-weight:800;color:var(--accent);margin-top:2px;letter-spacing:-.02em;line-height:1.1}
p{margin:8px 0}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:9px 14px;cursor:pointer;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
button:hover{border-color:var(--stroke2)}
button:active{filter:brightness(.95)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
button.bad{color:var(--danger)}
button.pri.bad,button.bad.pri{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.45;cursor:default}
a{color:var(--accent);text-decoration:none}
a.btn,a.lnkbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:9px 14px;color:var(--text);font-weight:600;min-height:44px;text-decoration:none}
/* stateful action buttons (.act): pend / on / done / err / dis */
button.act.on{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--text);border-color:var(--warn)}
button.act.done{background:color-mix(in srgb,var(--ok) 12%,var(--card));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
button.act.err{background:color-mix(in srgb,var(--danger) 10%,var(--card));color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
button.act.dis{opacity:.45}
button.act:not(.tile).pend::before{content:"";display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input,select,textarea{max-width:100%;min-height:44px;background:var(--bg);border:1px solid var(--stroke);border-radius:12px;padding:8px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--primary);flex:none;padding:0}
label.row{min-height:40px}
.pairf{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pairf input,.pairf button{width:100%}.pairf button{height:52px;font-size:16px}
#code{font-size:28px;text-align:center;letter-spacing:.35em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.app{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--stroke)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--track);flex:none;display:grid;place-items:center;font-weight:800;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1 1 50px;min-width:0}.app>button,.app>select{flex:none;margin-left:auto}.app>select{max-width:54%;padding-left:8px;padding-right:2px}.app .tag{white-space:nowrap}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
/* chips / tags with a tone */
.tag,.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--tn,var(--sub));background:color-mix(in srgb,var(--tn,var(--sub)) 13%,transparent);margin-left:4px;vertical-align:1px}
.tag .si,.chip .si{width:13px;height:13px}
.tag.bad,.t-bad{--tn:var(--danger)}.tag.ok,.t-ok{--tn:var(--ok)}.tag.warn,.t-warn{--tn:var(--warn)}.t-info{--tn:var(--accent)}.t-mute{--tn:var(--sub)}
button.chip{min-height:30px;border:0;padding:4px 10px;margin:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--stroke2);flex:none}
.dot.on{background:var(--ok)}.dot.bad{background:var(--danger)}.dot.warn{background:var(--warn)}
.si{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none}
.err{color:var(--danger)}
iframe{width:100%;height:220px;border:0;border-radius:12px}
.e{display:inline-block;width:1.4em;text-align:center;margin-right:2px}
.empty{text-align:center;padding:14px 4px;color:var(--sub)}.empty .e{display:block;width:auto;font-size:28px;margin:0 0 4px;color:var(--accent)}
code{word-break:break-all;font-size:12px}
.alert{background:color-mix(in srgb,var(--tn,var(--danger)) 12%,var(--card));color:var(--text);border:1px solid color-mix(in srgb,var(--tn,var(--danger)) 35%,transparent);border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:600}
.alert>.si:first-child{color:var(--tn,var(--danger))}
.totpqr{display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap}.totpqr .qrw{width:180px;flex:none;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--stroke)}.totpqr .qrw svg{display:block;width:100%;height:auto}.totpqr p{flex:1;min-width:160px;margin:0}
.alert.warn{--tn:var(--warn)}.alert.ok{--tn:var(--ok)}.alert.info{--tn:var(--accent)}
.dpb{display:inline-flex;align-items:center;gap:6px;font-weight:600}
/* modal layer: bottom sheet on phones, centred dialog on desktop */
#dpPop,#askPop{position:fixed;inset:0;z-index:50;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
#dpPop .dp,#askPop .dp{background:var(--card);color:var(--text);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 -8px 40px rgba(2,6,23,.25)}
#dpPop .dp::before,#askPop .dp::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--stroke2);margin:0 auto 14px}
@media(min-width:960px){#dpPop,#askPop{align-items:center}#dpPop .dp,#askPop .dp{width:440px;border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(2,6,23,.35)}#dpPop .dp::before,#askPop .dp::before{display:none}}
.dp h2{font-size:19px}
.dp .row>button.sp{height:52px;font-size:16px}
.shh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.shh h2{flex:1;margin:0}
.close{width:40px;height:40px;min-height:40px;border-radius:20px;background:var(--bg);border:0;padding:0;color:var(--sub);flex:none}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dpg button{min-height:40px;padding:2px;min-width:0;border-radius:12px}.dpg span{text-align:center;padding:9px 0;font-size:14px}
.dpg button.sel{outline:2px solid var(--ok);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:40px;min-width:48px;padding:0 12px;border-radius:12px;font-size:14px}
.chips button.on{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.sch{border-top:1px solid var(--stroke);padding:12px 0}
.sch:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dp .app{padding:8px 0}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin:6px 0}
.hist button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 0 2px;background:none;border:0;border-radius:8px;font-size:12px;color:var(--sub);min-width:0;gap:2px}
.hist button i{display:block;width:70%;background:var(--accent);opacity:.4;border-radius:5px 5px 0 0;min-height:2px}
.hist button.on i{opacity:1}.hist button.on{color:var(--text);font-weight:700;background:var(--bg)}
.scr{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:200px;display:grid;place-items:center}
.scr img{display:block;width:100%;max-height:75vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scr img:not([src]){display:none}
.scr.view img{touch-action:auto}
.scr-msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;text-align:center;pointer-events:none}
.scr-msg:empty{display:none}
.gst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;--gc:#fff}.gst line,.gst path{stroke:var(--gc);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}.gst circle{fill:var(--gc);stroke:rgba(0,0,0,.5);stroke-width:2}.gst text{fill:#fff;font:700 13px system-ui,sans-serif;paint-order:stroke;stroke:rgba(0,0,0,.85);stroke-width:4px}.gst.hint{--gc:#93c5fd}.gst.hint line{stroke-dasharray:8 8}.gst.drag{--gc:#fff}.gst.send{--gc:#fbbf24}.gst.ok{--gc:#4ade80;transition:opacity .6s .5s;opacity:0}.gst.bad,.gst.cancel{--gc:#f87171}.gst.cancel line{stroke-dasharray:6 6}
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(59,130,246,.6);pointer-events:none;animation:tp .5s forwards}
@keyframes tp{to{transform:scale(1.8);opacity:0}}
.bulk,.hbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;background:var(--card);border:1px solid var(--accent);border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(2,6,23,.2);margin:8px 0 12px}
.app input[type=checkbox]{flex:none}label.app{cursor:pointer}
.map{position:relative;height:260px;border-radius:14px;overflow:hidden;background:var(--track);touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px}
.map{cursor:grab}.map.drag{cursor:grabbing}.map .layer{position:absolute;inset:0;transform-origin:0 0}.map img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map svg{position:absolute;overflow:visible}.map circle{cursor:pointer}
.map .mz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.map .mz button{min-height:36px;width:36px;padding:0;background:var(--card);border-radius:12px}
.map .attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);color:#333;font-size:11px;padding:1px 5px}.map .attr a{color:#333}
.map .merr{position:absolute;left:8px;right:52px;top:8px;background:var(--card);color:var(--text);border:1px solid var(--stroke);border-radius:12px;padding:6px 10px;font-size:13px;pointer-events:none}
.tln{margin-top:10px}.tln .scH{display:flex;align-items:center;gap:10px}
.tln .scH button{width:48px;height:48px;min-height:48px;padding:0;border-radius:999px;flex:none}.tln .scH button[aria-pressed=true]{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.tln .scL{min-width:0;flex:1;line-height:1.25}.tln .scL b{font-size:22px;font-variant-numeric:tabular-nums;display:block}.tln .scL span{color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.tln .scW{position:relative;height:36px;margin-top:6px}
.tln .scK{position:absolute;left:11px;right:11px;top:50%;height:8px;transform:translateY(-50%);background:var(--track);border-radius:4px;overflow:hidden;pointer-events:none}
.tln .scK i{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.9}.tln .scK .pf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}
.tln input[type=range]{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:0;border:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;box-shadow:none}
.tln input[type=range]::-webkit-slider-runnable-track{background:transparent;height:36px;border:0}
.tln input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:7px;border-radius:50%;background:var(--card);border:3px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tln input[type=range]::-moz-range-track{background:transparent;border:0}
.tln input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--primary)}
.tln input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.tln input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.tln input[type=range]:disabled{cursor:default;opacity:.45}
.tln .scA{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#s-box.off{opacity:.45;pointer-events:none}#s-off:not([hidden]){display:flex;gap:10px;align-items:center;flex-wrap:wrap}#s-off .sp{min-width:12em}#s-off button{flex:none}
.stb{flex:1;min-width:0;justify-content:flex-start;text-align:left;border-color:transparent;background:transparent;padding:6px 8px;font-weight:400}.stb.on{background:var(--tint);border-color:var(--accent)}
.map .pin{position:absolute;transform:translate(-50%,-100%);background:var(--card);color:var(--text);border:2px solid;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(15,23,42,.2)}
#ear{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100vw - 32px));background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:16px;padding:8px 8px 8px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(2,6,23,.2);z-index:25;font-weight:600}
@media(min-width:960px){#ear{bottom:28px;left:calc(50% + 132px)}}
.sos{--tn:var(--danger);border-width:2px}
.ovk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:12px}.ovk .card{margin:0}
.ovk .nm{display:flex;align-items:center;gap:10px}.ovk .sw{width:12px;height:12px;border-radius:50%;flex:none}
.ovk .kv{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:12px}
.ovk .card.paused{background:color-mix(in srgb,var(--warn) 9%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.ovb{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}.ovb>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ovb .g{display:flex;gap:2px;align-items:flex-end;height:104px;width:100%;justify-content:center}.ovb .g i{flex:1;max-width:14px;border-radius:3px 3px 0 0;min-height:2px}
#saveBar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--danger);color:#fff;font-weight:600}
#saveBar button{margin-left:auto;background:#fff;color:#991b1b;border:0}
body.sb #toast{bottom:150px}
.row.tm{flex-wrap:nowrap}.row.tm input[type=time]{width:7.2em;padding:8px 6px}
select.lang{min-height:40px;padding:4px 8px;font-size:14px;flex:none;border-radius:20px}
/* collapsible section (sec()): header button + grid-rows animation; closed body is visibility:hidden (out of tab order) */
.cl{padding:0;overflow:hidden;margin-bottom:10px}
.cl.open{border-color:color-mix(in srgb,var(--accent) 35%,var(--stroke))}
.cl>h2{margin:0;font:inherit;color:inherit;display:block}
.clh{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:20px;padding:14px 16px;min-height:68px;justify-content:flex-start;font-weight:400}
.clh:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}.clh:active{filter:none}
.clh .cli{width:36px;height:36px;border-radius:11px;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.clh .clt{flex:1;min-width:0;display:flex;flex-direction:column}
.clh .clt b{font-weight:650;font-size:15.5px}
.clh .clr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.clh .clt>span:last-child:not(.clr){color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.clh .tag{margin:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clh .chev{color:var(--sub);transition:transform .18s ease;flex:none}
.cl.open .clh .chev{transform:rotate(180deg)}
.clb{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .2s ease,visibility 0s linear .2s}
.cl.open .clb{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .2s ease,visibility 0s;border-top:1px solid var(--stroke)}
.clb>div{min-height:0;overflow:hidden}
.clb>div>div{padding:12px 16px 18px}
.cl.open .clb>div{overflow:visible}
/* "Thiết bị" key/value rows */
.dvkv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--stroke)}.dvkv>span{color:var(--sub)}.dvkv>b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.cl .cl{border-radius:14px;box-shadow:none}

/* segmented control */

  };

  $("#hist").querySelectorAll("button").forEach(x => x.onclick = () => { histSel = +x.dataset.h; show(); });

      <select data-p="${esc(x.pkg)}" aria-label="${esc(t("apps.rule", x.label))}">

    $("#list").querySelectorAll("[data-ok]").forEach(bt => bt.onclick = () => { edit.approved.push(bt.dataset.ok); changed(); draw(); toast("ok|" + t("permitted")); });
    $("#list").querySelectorAll("[data-c]").forEach(c => c.onchange = () => { c.checked ? sel.set.add(c.dataset.c) : sel.set.delete(c.dataset.c); drawBar(); });

  if ($("#selAll")) $("#selAll").onclick = () => { visible().forEach(x => sel.set.add(x.pkg)); draw(); };

// v0.8 phone clean-up: hide preinstalled bloat (owner), clear an app's data (owner, Android 9+), heaviest apps (both modes)
// Hiding is edited as a draft (hideDraft, only while it differs from rules.hidden) and saved with ONE rules update.
// Per-app result comes from the phone's report: state.rules.hidden = what the phone has taken, preinstalled[].hidden = isApplicationHidden.
// Wanted + taken + still not hidden = the phone refused (ColorOS refuses some of its own apps, e.g. the game center / store / themes).
let hideDraft = null;
const mbTxt = m => m >= 1024 ? (m / 1024).toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " GB" : m + " MB";
function cleanStat() {
  const pre = (st && st.preinstalled) || [], saved = new Set((edit && edit.hidden) || []), took = new Set((st && st.rules && st.rules.hidden) || []);
  // preinstalled[].refused (phone >= 0.9.8): the OS said no to hiding it, so it counts as not hidden whatever "hidden" says
  const of = x => { const h = x.hidden && !x.refused; return saved.has(x.pkg) ? (x.refused ? "ref" : took.has(x.pkg) ? (h ? "ok" : "ref") : "wait") : (h && took.has(x.pkg) ? "show" : ""); };
  const n = { want: 0, ok: 0, ref: 0, wait: 0, of };
  pre.forEach(x => { const s = of(x); if (saved.has(x.pkg)) { n.want++; if (s === "ok" || s === "ref" || s === "wait") n[s]++; } });
  return n;
}
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
// Android 9+ (API 28) for DevicePolicyManager.clearApplicationUserData; state has only the release string ("8.1.0")
const canClear = () => !st || !st.android || !(parseInt(st.android, 10) < 9);
function cleanTab(b) {
  const owner = !isBasic() && st.owner !== false;
  if (!owner) { b.innerHTML = `<div class="card">${needOwner(t("no.hide"))}</div>`; return; }
  if (!st.preinstalled) { b.innerHTML = `<div class="card"><p class="mute">${ic("hourglass")} ${t("clean.noList")}</p></div>`; return; }
  const pre = st.preinstalled, saved = new Set(edit.hidden), S = cleanStat();
  const draft = () => hideDraft || saved;
  const sug = pre.filter(x => x.suggest || saved.has(x.pkg) || x.hidden), rest = pre.filter(x => !sug.includes(x));
  const TAG = { ok: `<span class="tag ok">${ic("check")} ${t("hd.ok")}</span>`, ref: `<span class="tag bad">${ic("ban")} ${t("hd.refused")}</span>`,
    wait: `<span class="tag">${ic("hourglass")} ${t("hd.waiting")}</span>`, show: `<span class="tag">${ic("hourglass")} ${t("hd.showing")}</span>` };
  const row = x => `<label class="app"><input type="checkbox" data-hd="${esc(x.pkg)}" ${draft().has(x.pkg) ? "checked" : ""}><div class="nm"><b>${esc(x.label)}</b><span class="mute">${esc(x.pkg)}${x.mb ? " · " + mbTxt(x.mb) : ""}${x.suggest ? `<span class="tag warn">${t("clean.sug")}</span>` : ""}${TAG[S.of(x)] || ""}</span></div></label>`;
  const pc = v => S.want ? (v / S.want * 100).toFixed(1) + "%" : "0";
  const nSug = pre.filter(x => x.suggest).length;
  b.innerHTML = `<div class="card"><h2>${ic("sparkles")} ${t("clean.h")}</h2>
    <p class="mute" style="margin:0">${t("clean.p", "<b>" + pre.filter(x => x.hidden && !x.refused).length + "</b>")}</p>
    ${S.want ? `<div class="prog" role="img" aria-label="${esc(t("hd.sum", S.ok, S.want))}"><i style="width:${pc(S.ok)}"></i><i class="b" style="width:${pc(S.ref)}"></i><i class="w" style="width:${pc(S.wait)}"></i></div>
      <div><b>${t("hd.sum", S.ok, S.want)}</b>${S.ref ? ` · <span class="err">${t("hd.refN", S.ref)}</span>` : ""}${S.wait ? ` · <span class="mute">${t("hd.waitN", S.wait)}</span>` : ""}</div>
      ${S.ref ? `<div class="alert warn" style="font-weight:400;font-size:13px">${ic("triangle-alert")} ${t("hd.refTip")}</div>` : ""}` : ""}</div>
  ${sec("cl-sug", "sparkles", t("hd.sugH"), t("hd.sugD"), [t("hd.nApps", sug.length)], sug.map(row).join("") || `<p class="mute">${t("clean.noSug")}</p>`, true)}
  ${rest.length ? sec("cl-rest", "layers", t("hd.restH"), t("hd.restD"), [t("hd.nApps", rest.length)], rest.map(row).join("")) : ""}
  <div class="hbar" id="hbar"></div>`;
  const bar = () => {
    const d = draft(), add = [...d].filter(p => !saved.has(p)).length, rem = [...saved].filter(p => !d.has(p)).length, dirty = !!hideDraft;
    $("#hbar").innerHTML = `<div class="row"><span class="sp mute">${ic("eye-off")} ${t("hd.sel", [...d].filter(p => pre.some(x => x.pkg === p)).length)}</span></div>
      <div class="row" style="margin-top:6px"><button type="button" id="hdSug" ${nSug ? "" : "disabled"}>${ic("square-check")} ${t("hd.allSug")}</button><button type="button" id="hdNone">${ic("square")} ${t("sel.none")}</button></div>
      ${dirty ? `<div class="row" style="margin-top:6px"><button type="button" class="pri sp" id="hdSave">${ic("save")} ${t("hd.save", add, rem)}</button><button type="button" id="hdUndo">${ic("x")} ${t("cancel")}</button></div>` : ""}`;
    $("#hdSug").onclick = () => { const s = new Set(draft()); pre.forEach(x => x.suggest && s.add(x.pkg)); setD(s); cleanTab(b); };
    $("#hdNone").onclick = () => { setD(new Set()); cleanTab(b); };
    if ($("#hdUndo")) $("#hdUndo").onclick = () => { hideDraft = null; cleanTab(b); };
    if ($("#hdSave")) $("#hdSave").onclick = async () => {
      if (!(await ask(t("hd.ask", add, rem), t("save")))) return;
      edit.hidden = [...draft()]; hideDraft = null; changed();   // one PUT with the whole rules.hidden
      toast("ok|" + t("hd.sent")); cleanTab(b); setTimeout(refresh, 1500);
    };
  };
  const setD = s => { hideDraft = sameSet(s, saved) ? null : s; };
  b.querySelectorAll("[data-hd]").forEach(c => c.onchange = () => { const s = new Set(draft()); c.checked ? s.add(c.dataset.hd) : s.delete(c.dataset.hd); setD(s); bar(); });
  bar();
}
function spaceTab(b) {
  const heavy = (st.apps || []).filter(x => x.mb > 0).sort((a, b) => b.mb - a.mb).slice(0, 15);
  const owner = !isBasic() && st.owner !== false, cc = owner && canClear();
  b.innerHTML = `<div class="card"><h2>${ic("hard-drive")} ${t("clean.heavy")}</h2>
    ${owner && !cc ? `<div class="alert warn" style="margin:0 0 8px;font-weight:400;font-size:13px">${ic("triangle-alert")} ${t("clean.oldOs", esc(st.android))}</div>` : ""}
    ${heavy.length ? heavy.map(x => `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${mbTxt(x.mb)}</span></div>${cc && !x.protected ? `<button type="button" data-clr="${esc(x.pkg)}" class="bad">${ic("trash-2")} ${t("clean.clear")}</button>` : ""}</div>`).join("")
      : `<p class="mute">${t("clean.noSize")}</p>`}
    <p class="mute">${ic("lightbulb")} ${cc ? t("clean.tipOwner") + " " : ""}${owner ? "" : t("clean.tipBasic") + " "}${t("clean.tipRam")}</p></div>`;
  b.querySelectorAll("[data-clr]").forEach(x => x.onclick = () => {
    const a = (st.apps || []).find(y => y.pkg === x.dataset.clr); if (!a) return;
    cmd({ type: "clearData", pkg: a.pkg }, t("clean.cleared", a.label),
      [t("clean.askClear", a.label), t("delete"), true]).then(() => setTimeout(refresh, 2000));
  });
}

// ---- "Máy" tab: device health, on demand (docs/protocol.md "Device health"). LAN: GET /api/device (phone caches 60 s).
// Relay: POST /device asks + returns the last stored snapshot; the phone PUTs a new one on its next sync (<= ~1 min).
let dv = null;      // {k, d: snapshot, tried, busy, wait, err}
const dvAct = {};   // button id -> {s: "pend" | "done" | "sent" | "err", t}
const byt = n => { n = +n || 0; const f = (v, d) => v.toLocaleString(lang, { maximumFractionDigits: d });
  return n >= 1e9 ? f(n / 1e9, n >= 1e11 ? 0 : 1) + " GB" : n >= 1e6 ? f(n / 1e6, 0) + " MB" : n >= 1e3 ? f(n / 1e3, 0) + " KB" : f(n, 0) + " B"; };
const dvDur = ms => ms >= 864e5 ? t("dv.days", Math.floor(ms / 864e5)) + (ms % 864e5 >= 36e5 ? " " + fmt(Math.floor(ms % 864e5 / 36e5) * 36e5) : "") : fmt(ms);
const dvDraw = () => { if (tab === "dev" && $("#body")) devTab($("#body")); };

function rulesWire(b, r) {

    <label class="row"><input type="checkbox" id="f-au" ${edit && edit.autoUpdate ? "checked" : ""}><span class="sp">${t("upd.auto")}</span></label>
    <div class="row" style="margin-top:8px"><button id="updNow" ${u.status === "downloading" || u.status === "installing" || u.status === "checking" ? "disabled" : ""}>${ic("refresh-cw")} ${t("upd.now")}</button></div></div>`;
}
// paired parent devices (state.devices, phone >= 0.9.8). Our own row: "self" on LAN; on the relay page, sha256(token)[:8].
const devIds = new Map();
async function devIdOf(k) {
  if (devIds.has(k.token)) return devIds.get(k.token);
  try { const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(k.token)));
    const id = [...h.slice(0, 4)].map(x => x.toString(16).padStart(2, "0")).join(""); devIds.set(k.token, id); return id; }
  catch { devIds.set(k.token, ""); return ""; }   // no WebCrypto (plain http): just no "this device" mark
}
function devsHtml() {
  const D = st.devices; if (!Array.isArray(D)) return "";
  const me = devIds.get(cur.token);
  return D.map(d => { const self = d.self || (!!me && d.id === me);
    return `<div class="app"><span class="ib">${ic(d.name === "relay" ? "globe" : "smartphone")}</span><div class="nm"><b>${d.name ? esc(d.name) : t("dev.noName")}</b>
      <span class="mute">${self ? `<span class="tag t-info" style="margin:0 4px 0 0">${t("dev.self")}</span>` : ""}${t("dev.at", d.at ? new Date(d.at).toLocaleDateString(lang) : "—")} · ${t("dev.last", d.last ? ago(d.last) : "—")}</span></div>
      <button type="button" class="bad" data-unp="${esc(d.id)}">${ic("unlink")} ${t("dev.unpair")}</button></div>`; }).join("") || `<p class="mute">${t("none")}</p>`;
}
function setTab(b) {
  const lan = cur.via === "lan", S = ruleSecs(edit);
  if (Array.isArray(st.devices) && !st.devices.some(d => d.self) && !devIds.has(cur.token)) { const k = cur; devIdOf(k).then(id => { if (id && k === cur && tab === "set") { lastSig = ""; render(); } }); }
  b.innerHTML = `<div class="g2"><div>
  <div class="sec">${t("set.security")}</div>
  <div class="card"><h2>${ic("key-round")} ${t("pin.h")}</h2><p class="mute">${t("pin.p")}</p>
    ${edit.pinSet ? "" : `<div class="alert warn">${ic("triangle-alert")} ${t("pin.none")}</div>`}
    <p class="mute">${edit.pinSet ? t("pin.change") : t("pin.set")}</p>
    <div class="row"><input class="sp" style="min-width:8em" id="f-pin" inputmode="numeric" type="password" placeholder="${esc(t("pin.ph"))}" aria-label="${esc(t("pin.new"))}" maxlength="8" autocomplete="new-password"><button id="savePin">${ic("key-round")} ${edit.pinSet ? t("pin.changeB") : t("pin.setB")}</button></div></div>
  <div id="rsx">${S.totp}</div>
  <div class="sec">${t("paired.h")}</div>
  <div class="card">${Array.isArray(st.devices) ? devsHtml() : `<p class="mute">${t("dev.old")}</p>`}
    <div class="row" style="margin-top:10px"><button id="openPair" class="sp">${ic("lock-open")} ${t("paired.add")}</button><button id="forget" class="sp">${ic("eraser")} ${APP ? t("forget.app") : t("forget.web")}</button></div><div id="pairOut" class="mute" style="margin-top:8px"></div></div>
  </div><div>
  <div class="sec">${t("set.general")}</div>
  <div class="card"><h2>${ic("user")} ${t("set.name")}</h2><div class="row"><input id="f-name" class="sp" aria-label="${esc(t("set.name"))}" value="${esc(cur.name)}"><button id="saveName">${ic("save")} ${t("save")}</button></div></div>
  <div class="card row"><h2 class="sp" style="margin:0">${ic("globe")} ${t("lang")}</h2>${langSel()}${themeBtn()}</div>
  ${APP ? `<div class="card"><h2>${ic("bell")} ${t("notif.h")}</h2><label class="row"><input type="checkbox" id="f-notify" ${kgCall("getNotify") === "false" || kgCall("canNotify") === "false" ? "" : "checked"}><span class="sp">${t("notif.p")}</span></label>${kgCall("getNotify") !== "false" && kgCall("canNotify") === "false" ? `<p class="mute">${ic("triangle-alert")} ${t("notif.blocked")}</p>` : ""}</div>` : ""}
  ${APP ? `<div class="card"><h2>${ic("history")} ${t("keep.h")}</h2><select id="f-days" aria-label="${esc(t("keep.h"))}">${["0", "30", "90", "365"].map(v => `<option value="${v}" ${String(kgCall("getHistoryDays") || "0") === v ? "selected" : ""}>${+v ? t("days", +v) : t("noLimitC")}</option>`).join("")}</select>
    <p class="mute">${t("keep.p")}</p></div>` : ""}
  ${updCard()}
  ${APP ? "" : `<div class="card"><h2>${ic("smartphone")} ${t("a2hs.h")}</h2><p class="mute">${t("a2hs.p")}</p></div>`}
  <div class="sec">${t("set.conn")}</div>
  ${tsCard(lan)}
  ${lan ? `<details class="card" id="relayBox"${st.relay || relayOpen ? " open" : ""}><summary><h2 style="display:inline-flex">${ic("globe")} ${t("relay.h")}</h2></summary>
    <p class="mute">${t("relay.p")}</p>
    <div class="row"><input id="relay" class="sp" placeholder="${esc(t("relay.ph"))}" aria-label="${esc(t("relay.addr"))}" value="${esc(st.relay || "")}"><button id="saveRelay" class="pri">${ic("globe")} ${t("turnOn")}</button></div>
    <div id="relayOut"></div></details>` : `<div class="card"><h2>${ic("globe")} ${t("conn.h")}</h2><p class="mute">${t("conn.p")}</p></div>`}
  <div class="sec" style="color:var(--danger)">${t("set.danger")}</div>
  <div class="card" style="border-color:color-mix(in srgb,var(--danger) 35%,var(--stroke))"><h2>${ic("unlink")} ${t("paired.unpair")}</h2><p class="mute">${t("ask.unpairAll")}</p><button id="unpair" class="bad">${ic("unlink")} ${t("paired.unpair")}</button>
    <h2 style="margin-top:18px">${ic("octagon-x")} ${t("rel.h")}</h2><p class="mute">${t("rel.p")}</p>
    <button id="release" class="bad">${ic("octagon-x")} ${t("rel.btn")}</button></div>
  </div></div>`;
  rulesWire($("#rsx"), edit);
  b.querySelectorAll("[data-unp]").forEach(x => x.onclick = async () => {
    const d = (st.devices || []).find(o => o.id === x.dataset.unp); if (!d) return;
    const k = cur, self = d.self || d.id === devIds.get(k.token), nm = d.name || t("dev.noName");
    if (!(await ask(t(self ? "dev.askSelf" : "dev.ask", nm), t("dev.unpair"), true))) return;
    x.disabled = true;
    let r;
    try { r = await call(k, "/cmd", "POST", { type: "unpair", id: d.id }); }
    catch (e) {   // LAN answers 404 {"result":"no such device"} when it is already gone
      if (/404|no such device/.test(e.message)) { toast("warn|" + t("cr.unpair.no such device")); refresh().catch(() => {}); }
      else toast("err|" + t("errX", e.message));
      x.disabled = false; return;
    }
    if (r && r.result && r.result !== "ok" && r.result !== "queued") { toast("err|" + tc("cr.unpair.", r.result, t("cmd.answer", r.result))); x.disabled = false; return; }
    toast((r && r.result === "queued" ? "send|" : "ok|") + t(r && r.result === "queued" ? "dev.queued" : "dev.unpaired", nm));
    if (k !== cur) return;
    if (self) {   // this browser's token is gone: back to pairing, never a dead page
      gen++; clearInterval(timer); screenStop(); earStop(); cur = null; kids = kids.filter(o => o !== k); save(kids); navDown(0); return setTimeout(boot, 800);
    }
    st.devices = st.devices.filter(o => o !== d); lastSig = ""; render();
  });
  if (APP) $("#f-days").onchange = e => kgCall("setHistoryDays", e.target.value);
  if (APP) $("#f-notify").onchange = e => { kgCall("setNotify", e.target.checked ? "true" : "false"); if (e.target.checked) setTimeout(() => { if (kgCall("canNotify") === "false") toast("warn|" + t("notif.blockedShort")); }, 1500); };
  if ($("#relayBox")) $("#relayBox").ontoggle = e => { relayOpen = e.target.open; };
  $("#saveName").onclick = () => { cur.name = $("#f-name").value || t("kid"); save(kids); render(); };
  $("#savePin").onclick = () => { const p = $("#f-pin").value; if (!/^\d{4,8}$/.test(p)) return toast("warn|" + t("pin.bad")); edit.pin = p; changed(); $("#f-pin").value = ""; };
  if (lan) $("#saveRelay").onclick = async () => {
    const url = $("#relay").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\//.test(url)) return toast("warn|" + t("relay.https"));
    const r = await cmd({ type: "relay", url }, t("turnedOn"));
    if (r && r.token) {
      const link = `${url}/#c=${encodeURIComponent(r.id)}&k=${encodeURIComponent(r.token)}&n=${encodeURIComponent(cur.name)}`;
      $("#relayOut").innerHTML = `<p>${ic("smartphone")} ${t("relay.link")}</p><code>${esc(link)}</code>
        <div class="row" style="margin-top:8px"><button id="copy">${ic("clipboard-copy")} ${t("relay.copy")}</button><a class="lnkbtn" href="${esc(link)}" target="_blank" rel="noopener">${ic("link")} ${t("open")}</a></div>`;
      $("#copy").onclick = () => { navigator.clipboard?.writeText(link).then(() => toast("ok|" + t("copied")), () => toast("warn|" + t("copyFail"))); };
    }
  };
  if ($("#tsOn")) $("#tsOn").onclick = async () => {
    const authKey = $("#f-ts-key").value.trim();
    if (!/^[A-Za-z0-9_-]{10,300}$/.test(authKey)) return toast("warn|" + t("ts.badKey"));
    const r = await cmd({ type: "tailscale", authKey, hostname: $("#f-ts-host").value.trim() }, t("ts.installTx"));
    if (r && r.result && r.result !== "ok") toast("err|" + t("cmd.answer", r.result));
    $("#f-ts-key").value = "";
  };
  if ($("#tsOff")) $("#tsOff").onclick = async () => { await cmd({ type: "tailscaleOff" }, t("turnedOff")); };
  $("#openPair").onclick = async () => {
    const r = await cmd({ type: "openPairing" }, t("pairT.shown"));
    if (r && (r.result === "ok" || r.result === "queued")) { pairLocal = { at: Date.now(), end: Date.now() + 600000 }; pairTick(); }
    if (r && r.result === "set PIN first") toast("warn|" + t("pairT.pinFirst"));
  };
  clearInterval(pairTick.i); pairTick.i = setInterval(pairTick, 1000); pairTick();
  $("#unpair").onclick = async () => { await cmd({ type: "unpairAll" }); };
  $("#forget").onclick = async () => {
    if (!(await ask(t(APP ? "forget.askApp" : "forget.askWeb", cur.name), APP ? t("delete") : t("forget"), true))) return;
    screenStop(); kids = kids.filter(x => x !== cur); save(kids); cur = null; clearInterval(timer); boot(); navDown(0); };
  if ($("#f-au")) $("#f-au").onchange = e => { if (!edit) return; edit.autoUpdate = e.target.checked; changed(); };
  if ($("#updNow")) $("#updNow").onclick = () => cmd({ type: "update" }, t("upd.sent"), [t("upd.ask"), t("upd.ok")]).then(() => setTimeout(refresh, 4000));
  $("#release").onclick = async () => {
    await cmd({ type: "release" }, t("rel.done"), [t("rel.ask"), t("rel.ok"), true, t("rel.word")]);
  };
}

appLang();
applyLang();
boot();
</script>
</body>
