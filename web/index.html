<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidGuard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KidGuard</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--btn:#2563eb;--pri-fg:#fff;--bad-bg:#fee2e2;--bad-fg:#991b1b;--ok-bg:#dcfce7;--ok-fg:#166534;--warn-bg:#fef3c7;--warn-fg:#92400e;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e5e7eb;--mute:#9ca3af;--line:#263041;--pri:#3b82f6;--chip:#1e293b;--btn:#2563eb;--bad-bg:#3b1519;--bad-fg:#fca5a5;--ok-bg:#12301d;--ok-fg:#86efac;--warn-bg:#3a2a0b;--warn-fg:#fcd34d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:30px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
button:active{filter:brightness(.92)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.pri{background:var(--btn);color:var(--pri-fg);border-color:var(--btn);font-weight:600}
button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select{max-width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.pairf{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pairf input,.pairf button{width:100%}
#code{font-size:28px;text-align:center;letter-spacing:.35em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.app{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:9px;background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1 1 110px;min-width:0}.app>button,.app>select{flex:none;margin-left:auto}.app .tag{white-space:nowrap}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-left:4px}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
.si{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none}
.err{color:var(--bad)}
iframe{width:100%;height:220px;border:0;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{white-space:nowrap}
.e{display:inline-block;width:1.4em;text-align:center;margin-right:2px}
.empty{text-align:center;padding:14px 4px;color:var(--mute)}.empty .e{display:block;width:auto;font-size:28px;margin:0 0 4px}
.tabs button.on{background:var(--btn);color:var(--pri-fg)}
code{word-break:break-all;font-size:12px}
button{min-height:44px}
.alert{background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:44px;padding:6px 8px}
.chips button.on{background:var(--btn);color:var(--pri-fg);border-color:var(--btn)}
.sch{border-top:1px solid var(--line);padding:10px 0}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin:6px 0}
.hist button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 0 2px;background:none;border:0;border-radius:6px;font-size:12px;color:var(--mute)}
.hist button i{display:block;width:70%;background:var(--pri);opacity:.45;border-radius:5px 5px 0 0;min-height:2px}
.hist button.on i{opacity:1}.hist button.on{color:var(--fg);font-weight:700;background:var(--chip)}
.scr{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:200px;display:grid;place-items:center}
.scr img{display:block;width:100%;max-height:75vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scr img:not([src]){display:none}
.scr.view img{touch-action:auto}
.scr-msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;text-align:center;pointer-events:none}
.scr-msg:empty{display:none}
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(59,130,246,.6);pointer-events:none;animation:tp .5s forwards}
@keyframes tp{to{transform:scale(1.8);opacity:0}}
.bulk{position:sticky;bottom:8px;background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);margin-top:8px}
.app input[type=checkbox]{flex:none}label.app{cursor:pointer}
.map{position:relative;height:260px;border-radius:10px;overflow:hidden;background:var(--chip);touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px}
.map .layer{position:absolute;inset:0}.map img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map svg{position:absolute;overflow:visible}.map circle{cursor:pointer}
.map .mz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.map .mz button{min-height:36px;width:36px;padding:0;background:var(--card)}
.map .attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);color:#333;font-size:11px;padding:1px 5px}.map .attr a{color:#333}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>

<script>
// One page for both: served by the child phone on the LAN (/api/...) and by the relay worker (/c/<id>/...).
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "kg.kids";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } };
const save = k => { try { localStorage.setItem(KEY, JSON.stringify(k)); } catch {} };
let kids = load(), cur = null, st = null, pendingRules = null, timer = null, edit = null, tab = "home", lastErr = "", seenAt = 0, answered = new Set(), histSel = -1;
const onLan = () => !location.pathname.startsWith("/c/") && !isRelayOrigin;
let isRelayOrigin = false;

const ic = n => `<svg class="si" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const dot = c => `<i class="dot ${c}"></i>`;
const noEmoji = s => String(s ?? "").replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "").replace(/^\s+/, "");
const TI = { ok: ["circle-check", "var(--ok)"], err: ["circle-x", "var(--bad)"], warn: ["triangle-alert", "var(--warn)"], send: ["send", ""] };
function toast(m) { const t = $("#toast"); const k = /^(ok|err|warn|send)\|/.exec(m); t.innerHTML = k ? `<span style="color:${TI[k[1]][1]}">${ic(TI[k[1]][0])}</span> ${esc(m.slice(k[0].length))}` : esc(m); t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2500); }
function fmt(ms) { if (ms < 0) return "—"; const m = Math.round(ms / 60000); return m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ " + (m % 60 ? m % 60 + " phút" : ""); }
function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + " giây trước" : s < 3600 ? Math.round(s / 60) + " phút trước" : Math.round(s / 3600) + " giờ trước"; }
const REASON = { blocked: "Đã chặn", appLimit: "Hết giờ app", new: "Chờ duyệt", paused: "Tạm dừng", schedule: "Lịch", bedtime: "Giờ ngủ", daily: "Hết giờ ngày" };
const hhmm = t => new Date(t).toLocaleTimeString("vi", { hour: "2-digit", minute: "2-digit" });
const DNS = [["", "Tắt"], ["family.adguard-dns.com", "AdGuard Family"], ["family.cloudflare-dns.com", "Cloudflare Family"], ["family-filter-dns.cleanbrowsing.org", "CleanBrowsing Family"]];
// rules from older phones may lack v0.2 fields
function norm(e) {
  e.dailyByDay = Array.isArray(e.dailyByDay) && e.dailyByDay.length === 7 ? e.dailyByDay : [];
  e.schedules = e.schedules || []; e.approved = e.approved || []; e.safeDns = e.safeDns || "";
  e.trackMin = e.trackMin === undefined ? 10 : +e.trackMin; e.lockLocation = e.lockLocation !== false; e.noAirplane = e.noAirplane !== false; e.showWatching = e.showWatching !== false; e.blockNew = !!e.blockNew;
  e.blocked = e.blocked || []; e.allow = e.allow || []; e.appMin = e.appMin || {};
  return e;
}
// index 0 = Monday, from "YYYY-MM-DD"
function dayIdx(day) { const [y, m, d] = String(day).split("-").map(Number); return (new Date(y, m - 1, d).getDay() + 6) % 7; }
function baseLimit(r, day) { return r.dailyByDay && r.dailyByDay.length === 7 && day ? +r.dailyByDay[dayIdx(day)] || 0 : r.dailyMin || 0; }
function todayLimit(r, day) { const b = baseLimit(r, day); return b ? b + (r.bonus && r.bonus.day === day ? r.bonus.min || 0 : 0) : 0; }

function base(k) { return k.via === "lan" ? "/api" : "/c/" + encodeURIComponent(k.id); }
async function call(k, path, method = "GET", body) {
  const r = await fetch(base(k) + path, { method, headers: { "X-KG-Token": k.token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// --- boot ---------------------------------------------------------------
async function boot() {
  // a link from the child: #c=<id>&k=<token>&n=<name>
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c") && h.get("k")) {
    isRelayOrigin = true;
    const k = { id: h.get("c"), token: h.get("k"), name: h.get("n") || "Con", via: "relay" };
    kids = kids.filter(x => !(x.id === k.id && x.via === "relay")).concat(k); save(kids);
    history.replaceState(null, "", location.pathname);
    return open(k);
  }
  let hello = null;
  try { const r = await fetch("/api/hello"); if (r.ok) hello = await r.json(); } catch {}
  if (hello) {  // served by the child itself
    const k = kids.find(x => x.via === "lan" && x.id === hello.id);
    if (k) return open(k);
    return pairScreen(hello);
  }
  isRelayOrigin = true;
  const relayKids = kids.filter(k => k.via === "relay");
  if (relayKids.length === 1) return open(relayKids[0]);
  listScreen(relayKids);
}

function pairScreen(hello) {
  $("#app").innerHTML = `<h1>${ic("shield")} KidGuard</h1><div class="card">
    <h2>${ic("link")} Ghép với máy của con</h2>
    ${hello.pairing ? `<p>${ic("hash")} Nhập mã 6 số đang hiện trên máy của con.</p>
    <div class="pairf"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456" aria-label="Mã 6 số">
    <input id="nm" placeholder="Tên con" value="Con" aria-label="Tên con">
    ${hello.pin ? `<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN của bố mẹ" aria-label="PIN của bố mẹ">` : ""}
    <button class="pri" id="go">${ic("link")} Ghép</button></div><p class="err" id="e"></p>`
    : `<p>${ic("hourglass")} Máy của con chưa mở ghép. Trên máy con: mở app KidGuard → <b>Ghép thêm máy của bố mẹ</b> (cần PIN của bố mẹ nếu đã đặt).</p><button onclick="location.reload()">${ic("refresh-cw")} Thử lại</button>`}
    ${hello.owner ? "" : `<p class="err">${ic("triangle-alert")} Máy con chưa có quyền Device Owner: chạy setup.sh (xem README).</p>`}
  </div>`;
  const go = $("#go"); if (!go) return;
  go.onclick = async () => {
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("#code").value, pin: $("#pin") ? $("#pin").value : "" }) });
      const j = await r.json();
      if (!r.ok) throw new Error({ "wrong code": "Sai mã, thử lại", "wrong pin": "Sai PIN", "pin locked": `Sai PIN nhiều lần, thử lại sau ${Math.ceil((j.wait || 60000) / 60000)} phút`,
        wait: "Sai nhiều lần: máy con đã đổi mã mới, đợi một lát rồi nhập mã mới", closed: "Máy con đã đóng ghép, mở lại trên máy con" }[j.error] || "Không ghép được");
      const k = { id: j.id, token: j.token, name: $("#nm").value || "Con", via: "lan" };
      kids = kids.filter(x => !(x.id === k.id && x.via === "lan")).concat(k); save(kids); open(k);
    } catch (e) { $("#e").textContent = e.message; }
  };
}

function listScreen(list) {
  $("#app").innerHTML = `<h1>${ic("shield")} KidGuard</h1>` + (list.length ? list.map((k, i) =>
    `<div class="card row"><b class="sp">${ic("user")} ${esc(k.name)}</b><button class="pri" data-i="${i}">${ic("folder-open")} Mở</button></div>`).join("")
    : `<div class="card empty"><span class="e">${ic("inbox")}</span><p>Chưa có máy nào. Mở link "điều khiển từ xa" từ trang của con (khi ở nhà, tab Cài đặt) để thêm.</p></div>`);
  $("#app").querySelectorAll("[data-i]").forEach(b => b.onclick = () => open(list[+b.dataset.i]));
}

// --- one child ------------------------------------------------------------
async function open(k) { screenStop(); cur = k; st = null; edit = null; trk = []; trkLoaded = 0; mv = null; sel.on = false; sel.set.clear(); render(); await refresh(); clearInterval(timer); timer = setInterval(refresh, k.via === "lan" ? 4000 : 8000); }

async function refresh() {
  if (!cur) return;
  try {
    const j = await call(cur, "/state");
    // LAN: the state itself; relay: {state, rules (sent, not yet taken), seen}
    st = j.state !== undefined ? j.state : j;
    pendingRules = j.state !== undefined ? j.rules : null;
    seenAt = j.state !== undefined ? +j.seen || 0 : 0;
    lastErr = "";
  } catch (e) {
    lastErr = e.message;
    if (/not paired/.test(e.message)) { kids = kids.filter(x => x !== cur); save(kids); toast("Thiết bị này đã bị huỷ ghép"); return setTimeout(boot, 1000); }
  }
  if (!edit && st && st.rules) edit = norm(structuredClone(pendingRules && pendingRules.rev > st.rules.rev ? pendingRules : st.rules));
  // redraw the tab only when what it shows changed and nobody is using a control (icons would reload, a select would close)
  const sig = st ? JSON.stringify([tab, st.rules && st.rules.rev, st.apps.map(a => [a.suspended, a.blocked, Math.floor(a.ms / 60000)]),
    st.location && st.location.t, (st.log || []).length, (st.track || []).length, Math.floor(st.usedMs / 60000), lastErr,
    (st.requests || []).map(q => q.id), (st.history || []).length, st.limitMin, (st.apps || []).filter(a => a.new).length]) : lastErr;
  const busy = document.activeElement && /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (tab === "screen") updateLive();   // never redraw the screen tab: the <img> updates by itself
  else if (sig !== lastSig && !busy) { lastSig = sig; render(); } else updateLive();
}
let lastSig = "";

let saveT = null;
function changed() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { const body = { ...edit }; delete body.pinHash; delete body.pinSet; if (!body.pin) delete body.pin;
      const r = await call(cur, "/rules", "PUT", body); const hadPin = !!body.pin; if (cur.via === "lan") edit = norm(r); delete edit.pin; if (hadPin) edit.pinSet = true; delete edit.pinHash; toast(cur.via === "lan" ? "ok|Đã lưu" : "send|Đã gửi, máy con nhận trong ~20 giây"); }
    catch (e) { toast("err|Lỗi: " + e.message); }
  }, 500);
}

async function cmd(c, okMsg) {
  try { const r = await call(cur, "/cmd", "POST", c); toast("ok|" + (okMsg || "Đã gửi")); return r; } catch (e) { toast("err|Lỗi: " + e.message); }
}

function render() {
  if (!cur) return;
  const a = $("#app");
  const focus = document.activeElement && document.activeElement.id;   // keep the field being typed in
  if (focus && /^(f-|msg|relay)/.test(focus)) { updateLive(); return; }
  if (tab !== "screen") screenStop();
  const online = st && Date.now() - st.t < (cur.via === "lan" ? 30000 : 120000);
  a.innerHTML = `
  <div class="row"><h1 class="sp">${ic("user")} ${esc(cur.name)}</h1>${kids.length > 1 || cur.via === "relay" ? `<button id="back">${ic("list")} Danh sách</button>` : ""}</div>
  <div class="card" id="live"></div>
  <div class="tabs">${[["home", ic("house") + " Hôm nay"], ["screen", ic("smartphone") + " Màn hình"], ["apps", ic("puzzle") + " Ứng dụng"], ["rules", ic("ruler") + " Luật"], ["where", ic("map-pin") + " Vị trí"], ["set", ic("settings") + " Cài đặt"]].map(([id, n]) => `<button data-tab="${id}" class="${tab === id ? "on" : ""}">${n}</button>`).join("")}</div>
  <div id="body"></div>`;
  a.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  if ($("#back")) $("#back").onclick = () => { screenStop(); cur = null; clearInterval(timer); listScreen(kids.filter(k => k.via === (onLan() ? "lan" : "relay"))); };
  updateLive();
  const body = $("#body");
  if (!st) { body.innerHTML = `<div class="card mute">${lastErr ? dot("bad") + " Không kết nối được: " + esc(lastErr) : ic("hourglass") + " Đang tải…"}</div>`; return; }
  ({ home: homeTab, screen: screenTab, apps: appsTab, rules: rulesTab, where: whereTab, set: setTab })[tab](body);
}

function updateLive() {
  const el = $("#live"); if (!el) return;
  if (!st) { el.innerHTML = `<span class="mute">${lastErr ? ic("triangle-alert") + " " + esc(lastErr) : ic("hourglass") + " Đang kết nối…"}</span>`; return; }
  const lan = cur.via === "lan";
  const online = Date.now() - st.t < (lan ? 30000 : 120000);
  
  const lost = lan ? (lastErr || Date.now() - st.t > 300000) : (seenAt && Date.now() - seenAt > 300000);
  const lostFrom = lan ? st.t : seenAt;

function drawHist() {
  const days = (st.history || []).slice().reverse().concat([{ day: st.day, ms: st.usedMs, top: st.apps.filter(x => x.ms > 0).slice(0, 5) }]);
  const mx = Math.max(60000, ...days.map(d => d.ms)), WD = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  if (histSel < 0 || histSel >= days.length) histSel = days.length - 1;
  const show = () => {
    const d = days[histSel];
    $("#hist").querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i === histSel));
    $("#histTop").innerHTML = `<b>${esc(d.day.slice(8))}/${esc(d.day.slice(5, 7))}: ${fmt(d.ms)}</b>` + ((d.top || []).length ? (d.top || []).map(t => `<div>${esc(t.label || t.pkg)} · ${fmt(t.ms)}</div>`).join("") : "<div>" + ic("circle-dashed") + " Không có dữ liệu app</div>");
  };
  $("#hist").innerHTML = days.map((d, i) => `<button data-h="${i}" aria-label="${esc(d.day)}: ${fmt(d.ms)}"><i style="height:${Math.max(2, Math.round(d.ms / mx * 90))}px"></i>${WD[dayIdx(d.day)]}</button>`).join("");
  $("#hist").querySelectorAll("button").forEach(x => x.onclick = () => { histSel = +x.dataset.h; show(); });
  show();
}

function icon(x) {
  const l = ((x.label || "?").trim()[0] || "?").toUpperCase(), letter = esc(l), hue = (l.charCodeAt(0) * 47) % 360;
  const st0 = `background:hsl(${hue} 55% 45%);color:#fff`;
  return cur.via === "lan" ? `<span class="ic" style="${st0}"><img data-l="${letter}" src="/api/icon?pkg=${encodeURIComponent(x.pkg)}&k=${encodeURIComponent(cur.token)}" onload="this.parentNode.style.background='none'" onerror="this.parentNode.textContent=this.dataset.l"></span>` : `<span class="ic" style="${st0}">${letter}</span>`;
}
function appRow(x) {
  return `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${fmt(x.ms)}${x.suspended || x.blocked ? `<span class="tag bad">${REASON[x.blocked] || "Đã khoá"}</span>` : ""}</span></div></div>`;
}

const sel = { on: false, set: new Set(), f: "all", limOpen: false };
function appsTab(b) {
  const mode = p => edit.blocked.includes(p) ? "block" : edit.allow.includes(p) ? "allow" : edit.appMin[p] ? "limit" : "normal";
  const isNew = x => x.new && !edit.approved.includes(x.pkg);
  const FILT = [["all", "Tất cả"], ["new", ic("sparkles") + " Mới"], ["blocked", ic("octagon-x") + " Đang chặn"], ["limited", ic("timer") + " Có giới hạn"]];
  const pass = x => { const m = mode(x.pkg); return sel.f === "all" || (sel.f === "new" && isNew(x)) || (sel.f === "blocked" && (m === "block" || x.suspended)) || (sel.f === "limited" && m === "limit"); };
  const visible = () => { const q = ($("#f-q").value || "").toLowerCase(); return st.apps.filter(x => !x.protected && pass(x) && (!q || x.label.toLowerCase().includes(q) || x.pkg.includes(q))); };
  b.innerHTML = `<div class="card"><div class="row"><h2 class="sp" style="margin:0">${ic("puzzle")} Ứng dụng (${st.apps.length})</h2><button id="selTog" class="${sel.on ? "pri" : ""}">${sel.on ? ic("x") + " Thoát chọn" : ic("square-check") + " Chọn nhiều"}</button></div>
    <input id="f-q" placeholder="Tìm app…" style="width:100%;margin:10px 0 6px">
    <div class="chips" id="flt">${FILT.map(([v, n]) => `<button data-f="${v}" class="${sel.f === v ? "on" : ""}">${n}</button>`).join("")}</div>
    ${sel.on ? `<div class="row" style="margin-top:8px"><button id="selAll">${ic("square-check")} Chọn tất cả</button><button id="selNone">${ic("square")} Bỏ chọn</button></div>` : ""}
    <div id="list"></div><p class="mute">${ic("lightbulb")} "Luôn cho phép": không bị khoá bởi giới hạn ngày, giờ ngủ, tạm dừng, và không tính vào giờ dùng. Điện thoại, Cài đặt và màn hình chính luôn được giữ (app hệ thống được bảo vệ không nằm trong danh sách và bị bỏ qua khi chọn hàng loạt).</p></div>
    ${sel.on ? `<div class="bulk" id="bulk"></div>` : ""}`;
  const drawBar = () => {
    const bar = $("#bulk"); if (!bar) return;
    const n = sel.set.size, dis = n ? "" : "disabled";
    bar.innerHTML = `<div class="row"><b class="sp">${ic("check")} Đã chọn ${n}</b></div>
      <div class="row" style="margin-top:6px"><button ${dis} data-a="block" class="bad">${ic("octagon-x")} Chặn</button><button ${dis} data-a="unblock">${ic("circle-check")} Bỏ chặn</button><button ${dis} data-a="allow">${ic("star")} Luôn cho phép</button><button ${dis} data-a="lim">${ic("timer")} Giới hạn…</button><button ${dis} data-a="unlim">${ic("trash-2")} Bỏ giới hạn</button><button ${dis} data-a="approve">${ic("thumbs-up")} Duyệt</button></div>
      ${sel.limOpen ? `<div class="row" style="margin-top:6px"><input id="f-lim" type="number" min="1" max="1440" step="5" inputmode="numeric" placeholder="phút/ngày" style="width:8em"><button id="limOk" class="pri" ${dis}>${ic("circle-check")} Áp dụng</button></div>` : ""}`;
    const clr = p => { edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p]; };
    const apply = (msg, fn) => {
      const pk = [...sel.set].filter(p => { const a = st.apps.find(x => x.pkg === p); return a && !a.protected; });
      if (!pk.length) return toast("warn|Chưa chọn app nào");
      pk.forEach(fn); changed(); toast("ok|" + msg + ": " + pk.length + " app"); sel.set.clear(); sel.limOpen = false; draw(); setTimeout(refresh, 1200);   // one PUT (debounced), then refresh
    };
    bar.querySelectorAll("[data-a]").forEach(x => x.onclick = () => {
      const a = x.dataset.a;
      if (a === "block") apply("Đã chặn", p => { clr(p); edit.blocked.push(p); });
      else if (a === "unblock") apply("Đã bỏ chặn", p => { edit.blocked = edit.blocked.filter(v => v !== p); });
      else if (a === "allow") apply("Luôn cho phép", p => { clr(p); edit.allow.push(p); });
      else if (a === "unlim") apply("Đã bỏ giới hạn", p => { delete edit.appMin[p]; });
      else if (a === "approve") apply("Đã duyệt", p => { if (!edit.approved.includes(p)) edit.approved.push(p); });
      else if (a === "lim") { sel.limOpen = !sel.limOpen; drawBar(); const i = $("#f-lim"); if (i) i.focus(); }
    });
    if ($("#limOk")) $("#limOk").onclick = () => {
      const m = Math.round(+$("#f-lim").value); if (!(m >= 1 && m <= 1440)) return toast("warn|Nhập 1–1440 phút");
      apply("Giới hạn " + m + " phút", p => { edit.blocked = edit.blocked.filter(v => v !== p); edit.allow = edit.allow.filter(v => v !== p); edit.appMin[p] = m; });
    };
  };
  const draw = () => {
    const vis = visible();
    $("#list").innerHTML = vis.map(x => {
      const m = mode(x.pkg), nw = isNew(x);
      const info = `<div class="nm"><b>${esc(x.label)}</b><span class="mute">${fmt(x.ms)} hôm nay${x.suspended || x.blocked ? `<span class="tag bad">${REASON[x.blocked] || "Đã khoá"}</span>` : ""}${nw ? `<span class="tag" style="background:#fef3c7;color:#92400e">${ic("sparkles")} Mới cài</span>` : ""}${m === "block" ? `<span class="tag bad">${ic("octagon-x")} Chặn</span>` : m === "allow" ? `<span class="tag">${ic("star")}</span>` : m === "limit" ? `<span class="tag">${ic("timer")} ${edit.appMin[x.pkg]} phút</span>` : ""}</span></div>`;
      if (sel.on) return `<label class="app"><input type="checkbox" data-c="${esc(x.pkg)}" ${sel.set.has(x.pkg) ? "checked" : ""}>${icon(x)}${info}</label>`;
      return `<div class="app">${icon(x)}${info}
      ${nw ? `<button class="pri" data-ok="${esc(x.pkg)}">${ic("circle-check")} Cho phép</button>` : ""}
      <select data-p="${esc(x.pkg)}">
        <option value="normal" ${m === "normal" ? "selected" : ""}>Bình thường</option>
        ${[15, 30, 45, 60, 90, 120].map(n => `<option value="${n}" ${m === "limit" && edit.appMin[x.pkg] === n ? "selected" : ""}>${n} phút/ngày</option>`).join("")}
        ${m === "limit" && ![15, 30, 45, 60, 90, 120].includes(edit.appMin[x.pkg]) ? `<option value="${edit.appMin[x.pkg]}" selected>${edit.appMin[x.pkg]} phút/ngày</option>` : ""}
        <option value="block" ${m === "block" ? "selected" : ""}>Chặn</option>
        <option value="allow" ${m === "allow" ? "selected" : ""}>Luôn cho phép</option>
      </select></div>`;
    }).join("") || `<div class="empty"><span class="e">${ic("circle-dashed")}</span>Không có app nào</div>`;
    $("#list").querySelectorAll("[data-ok]").forEach(bt => bt.onclick = () => { edit.approved.push(bt.dataset.ok); changed(); draw(); toast("ok|Đã cho phép"); });
    $("#list").querySelectorAll("[data-c]").forEach(c => c.onchange = () => { c.checked ? sel.set.add(c.dataset.c) : sel.set.delete(c.dataset.c); drawBar(); });
    $("#list").querySelectorAll("select").forEach(s => s.onchange = () => {
      const p = s.dataset.p, v = s.value;
      edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p];
      if (v === "block") edit.blocked.push(p); else if (v === "allow") edit.allow.push(p); else if (v !== "normal") edit.appMin[p] = +v;
      changed();
    });
    drawBar();
  };
  $("#f-q").oninput = draw;
  $("#selTog").onclick = () => { sel.on = !sel.on; sel.set.clear(); sel.limOpen = false; appsTab(b); };
  b.querySelectorAll("#flt [data-f]").forEach(x => x.onclick = () => { sel.f = x.dataset.f; appsTab(b); });
  if ($("#selAll")) $("#selAll").onclick = () => { visible().forEach(x => sel.set.add(x.pkg)); draw(); };
  if ($("#selNone")) $("#selNone").onclick = () => { sel.set.clear(); draw(); };
  draw();
}

// Runs independently of the 4 s state poll (refresh() never redraws the screen tab).
const scr = { gen: 0, url: null, seq: 0, frames: [], lat: 0, liveT: null, view: false, err: "", msg: "" };
const ERRS = { "acc off": "Chưa bật Trợ năng — chạy lại cài đặt", "screen off": "Màn hình máy con đang tắt", "unsupported": "Máy con dùng Android cũ, chưa hỗ trợ xem màn hình (cần Android 11+)", "busy": "Máy con đang bận, thử lại…" };

function screenMsg(t) { scr.msg = t; const m = $("#s-msg"); if (m) m.textContent = t; }

  el.textContent = scr.frames.length ? `${fps.toFixed(1)} khung/giây · trễ ${Math.round(scr.lat)} ms` : "";
}
function showFrame(blob, lat) {

}
function screenStop() {
  scr.gen++; clearInterval(scr.liveT); scr.liveT = null;
  if (scr.url) { URL.revokeObjectURL(scr.url); scr.url = null; }
  scr.frames = []; scr.seq = 0; scr.msg = "";
}
function screenStart() {
  if (!cur || document.hidden) return;
  const gen = ++scr.gen, k = cur; clearInterval(scr.liveT);
  const img = $("#s-img"); if (img && scr.url) img.src = scr.url;
  screenMsg(scr.msg || "Đang kết nối…");
  const alive = () => scr.gen === gen && tab === "screen";
  if (k.via === "lan") (async () => {
    while (alive()) {
      const t0 = performance.now();
      try {
        const r = await fetch("/api/screen?max=720&q=50", { headers: { "X-KG-Token": k.token }, cache: "no-store" });
        if (!r.ok) { const j = await r.json().catch(() => ({})); if (alive()) screenMsg(errText(j.error) || "Chưa xem được màn hình"); await sleep(1500); continue; }
        const blob = await r.blob(); if (!alive()) break;
        showFrame(blob, performance.now() - t0);
      } catch { if (alive()) screenMsg("Mất kết nối tới máy con"); await sleep(2000); continue; }
      await sleep(Math.max(0, 400 - (performance.now() - t0)));   // ~2.5 fps
    }
  })();
  else {
    const ping = () => call(k, "/live", "POST", {}).catch(e => { if (alive()) screenMsg("Lỗi: " + e.message); });
    ping(); scr.liveT = setInterval(ping, 10000);
    (async () => {
      screenMsg("Đang chờ máy con kết nối (tối đa ~20 giây)…");
      while (alive()) {
        try {
          const r = await fetch(base(k) + "/frame?after=" + scr.seq, { headers: { "X-KG-Token": k.token }, cache: "no-store" });
          if (!alive()) break;
          if (r.status === 204) { const e = r.headers.get("X-KG-Err"); screenMsg(e ? errText(e) : scr.frames.length ? "" : "Đang chờ máy con kết nối (tối đa ~20 giây)…"); await sleep(200); continue; }
          if (!r.ok) { const j = await r.json().catch(() => ({})); screenMsg("Lỗi: " + (j.error || "HTTP " + r.status)); await sleep(2000); continue; }
          const blob = await r.blob(); if (!alive()) break;
          scr.seq = +r.headers.get("X-KG-Seq") || scr.seq;
          showFrame(blob, +r.headers.get("X-KG-Age") || 0);
        } catch { if (alive()) screenMsg("Mất kết nối, đang thử lại…"); await sleep(2000); }
      }
    })();
  }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) screenStop(); else if (cur && tab === "screen") screenStart(); });

async function sendInput(o) {

    catch (e) { if (cur.via !== "relay" || e.message !== "not live") throw e; await call(cur, "/live", "POST", {}); r = await call(cur, "/input", "POST", o); } if (r.result && r.result !== "ok" && r.result !== "queued") toast(errText(r.result)); }
  catch (e) { toast("err|Lỗi: " + e.message); }
}

// --- location history map (no external scripts: OSM tiles as <img> + SVG overlay) -----------
let trk = [], trkLoaded = 0, trkDay = "", mv = null;
const dkey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const hav = (a, b, c, d) => { const R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r, x = Math.sin(dl / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const wx = lon => (lon + 180) / 360, wy = lat => { const s = Math.sin(lat * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };   // world fraction 0..1
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m"; };
function allTrack() { const m = new Map(); trk.concat(st.track || []).forEach(p => m.set(p[0], p)); return [...m.values()].sort((a, b) => a[0] - b[0]); }
function stopsOf(pts) {
  const out = []; let c = null;
  for (const p of pts) {
    if (c && hav(c.lat, c.lon, p[1], p[2]) < 100) { c.n++; c.end = p[0]; c.lat += (p[1] - c.lat) / c.n; c.lon += (p[2] - c.lon) / c.n; }
    else { if (c) out.push(c); c = { start: p[0], end: p[0], lat: p[1], lon: p[2], n: 1 }; }
  }
  if (c) out.push(c);
  return out.filter(s => s.n >= 2 && s.end - s.start >= 5 * 60000);
}
function fitView(pts, w, h) {
  const xs = pts.map(p => wx(p[2])), ys = pts.map(p => wy(p[1])), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let z = 17; while (z > 2 && ((x1 - x0) * 256 * 2 ** z > w - 70 || (y1 - y0) * 256 * 2 ** z > h - 70)) z--;
  return { z, fx: (x0 + x1) / 2, fy: (y0 + y1) / 2 };
}
function drawMap(pts) {
  const box = $("#map"); if (!box) return;
  const w = box.clientWidth || 340, h = 260, S = 256 * 2 ** mv.z, left = mv.fx * S - w / 2, top = mv.fy * S - h / 2, n = 2 ** mv.z;
  let tiles = "";
  for (let ty = Math.floor(top / 256); ty <= Math.floor((top + h) / 256); ty++) for (let tx = Math.floor(left / 256); tx <= Math.floor((left + w) / 256); tx++) {
    if (ty < 0 || ty >= n) continue;
    tiles += `<img alt="" draggable="false" src="https://tile.openstreetmap.org/${mv.z}/${((tx % n) + n) % n}/${ty}.png" style="left:${Math.round(tx * 256 - left)}px;top:${Math.round(ty * 256 - top)}px">`;
  }
  const xy = pts.map(p => [wx(p[2]) * S - left, wy(p[1]) * S - top]);
  const line = xy.map(q => q.map(v => v.toFixed(1)).join(",")).join(" ");
  const last = pts.length - 1;
  const dots = xy.map((q, i) => `<circle data-i="${i}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i === 0 || i === last ? 8 : 5}" fill="${i === 0 ? "#16a34a" : i === last ? "#dc2626" : "#2563eb"}" stroke="#fff" stroke-width="2"/>`).join("");
  box.innerHTML = `<div class="layer" id="mlayer">${tiles}<svg width="${w}" height="${h}" style="left:0;top:0"><polyline points="${line}" fill="none" stroke="#2563eb" stroke-width="3" stroke-opacity=".7" stroke-linejoin="round"/>${dots}</svg></div>
    <div class="mz"><button id="mzi" aria-label="Phóng to">${ic("plus")}</button><button id="mzo" aria-label="Thu nhỏ">${ic("minus")}</button></div><div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>`;
  $("#mzi").onclick = () => { mv.z = Math.min(18, mv.z + 1); drawMap(pts); };
  $("#mzo").onclick = () => { mv.z = Math.max(2, mv.z - 1); drawMap(pts); };
  box.querySelectorAll("circle").forEach(c => c.onclick = () => { if (box._moved) return; const p = pts[+c.dataset.i]; $("#mapInfo").textContent = `${hhmm(p[0])} · sai số ±${Math.round(p[3] || 0)} m`; });
}
function mapDrag(pts) {
  const box = $("#map"); let d = null;
  box.onpointerdown = e => { if (e.target.closest("button,a")) return; d = { x: e.clientX, y: e.clientY, id: e.pointerId }; box._moved = false; };
  box.onpointermove = e => {
    if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!box._moved && Math.hypot(dx, dy) > 5) { box._moved = true; try { box.setPointerCapture(d.id); } catch {} }
    if (box._moved) { const l = $("#mlayer"); if (l) l.style.transform = `translate(${dx}px,${dy}px)`; }
  };
  const end = e => {
    if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; d = null;
    if (box._moved) { const S = 256 * 2 ** mv.z; mv.fx -= dx / S; mv.fy -= dy / S; drawMap(pts); setTimeout(() => box._moved = false, 50); }
  };
  box.onpointerup = end; box.onpointercancel = end;
}

    : `<div class="empty"><span class="e">${ic("map")}</span>Chưa có vị trí. Bật Vị trí trên máy con rồi bấm Lấy vị trí.</div>`}
    <button id="loc2" class="pri">${ic("map-pin")} Lấy vị trí mới</button><p class="mute">${ic("refresh-cw")} Máy con tự ghi vị trí theo chu kỳ đặt trong tab Luật.</p></div>`;

  const cls = { on: "ok", error: "bad", installing: "warn" }[t.state] || "";
  const url = t.ip ? `http://${t.ip}:8770` : "";
  return `<div class="card"><h2>${ic("route")} Điều khiển từ xa qua Tailscale</h2>
    <p class="mute">Không cần Cloudflare: máy con tự cài Tailscale và vào mạng riêng của bạn. Điện thoại bố mẹ cài Tailscale cùng tài khoản rồi mở địa chỉ bên dưới.</p>
    <p><span class="tag ${cls}">${esc(label)}</span>${t.host ? ` · tên máy <b>${esc(t.host)}</b>` : ""}</p>
    ${t.err ? `<div class="alert warn">${ic("triangle-alert")} ${esc(t.err)}</div>` : ""}
    ${url ? `<p>${ic("link")} <code>${esc(url)}</code></p>` : ""}
    ${lan ? `<p class="mute">Tạo khoá ở login.tailscale.com → Settings → Keys (Reusable, không Ephemeral). Khoá chỉ lưu trên máy con.</p>
    <div class="row"><input id="f-ts-key" class="sp" type="password" autocomplete="off" placeholder="tskey-auth-…"></div>
    <div class="row" style="margin-top:8px"><input id="f-ts-host" class="sp" placeholder="Tên máy (tuỳ chọn), vd kid-an" value="${esc(t.host || "")}"><button id="tsOn" class="pri">${ic("route")} ${t.state === "off" ? "Bật" : "Bật lại"}</button></div>`
      : `<p class="mute">Bật/đổi khoá chỉ làm được khi ở nhà (cùng Wi‑Fi với máy con).</p>`}
    ${t.state !== "off" ? `<button id="tsOff" class="bad" style="margin-top:8px">${ic("x")} Tắt và gỡ Tailscale</button>
    <p class="mute">Sau khi tắt: vào login.tailscale.com → Machines xoá máy "${esc(t.host || "kid")}" (app đã gỡ không tự đăng xuất được). Biểu tượng chìa khoá trên thanh trạng thái của con là do Android, không ẩn được.</p>` : ""}</div>`;
}

function setTab(b) {
  const lan = cur.via === "lan";
  b.innerHTML = `
  <div class="card"><h2>${ic("user")} Tên</h2><div class="row"><input id="f-name" class="sp" value="${esc(cur.name)}"><button id="saveName">${ic("save")} Lưu</button></div></div>
  <div class="card"><h2>${ic("key-round")} PIN của bố mẹ</h2><p class="mute">Cần PIN này để mở ghép thêm máy ngay trên máy con.</p>
    ${edit.pinSet ? "" : `<div class="alert warn">${ic("triangle-alert")} Chưa đặt PIN — nên đặt để con không tự ghép máy</div>`}
    <div class="row"><input id="f-pin" inputmode="numeric" type="password" placeholder="${edit.pinSet ? "Đã đặt PIN" : "Chưa đặt PIN"} (nhập 4–8 số để đổi)" maxlength="8" autocomplete="new-password"><button id="savePin">${ic("key-round")} ${edit.pinSet ? "Đổi PIN" : "Đặt PIN"}</button></div></div>
  ${tsCard(lan)}
  ${lan ? `<details class="card" id="relayBox"${st.relay || relayOpen ? " open" : ""}><summary><h2 style="display:inline">${ic("globe")} Nâng cao: relay Cloudflare Worker</h2></summary>
    <p class="mute">Không muốn cài Tailscale trên điện thoại bố mẹ? Dùng một Cloudflare Worker của bạn (miễn phí, cần deploy, xem README). Lệnh tới máy con chậm hơn (~20 giây). Dán địa chỉ:</p>
    <div class="row"><input id="relay" class="sp" placeholder="https://kidguard.ten-ban.workers.dev" value="${esc(st.relay || "")}"><button id="saveRelay" class="pri">${ic("globe")} Bật</button></div>
    <div id="relayOut"></div></details>` : `<div class="card"><h2>${ic("globe")} Kết nối</h2><p class="mute">Qua relay. Lệnh tới máy con trong khoảng 20 giây (màn hình tắt: 60 giây).</p></div>`}
  <div class="card"><h2>${ic("link")} Máy đã ghép</h2>
    <div class="grid"><button id="openPair">${ic("lock-open")} Mở ghép thêm (10 phút)</button><button id="unpair" class="bad">${ic("unlink")} Huỷ ghép tất cả</button><button id="forget">${ic("eraser")} Quên máy này ở trình duyệt</button></div></div>
  <div class="card"><h2>${ic("smartphone")} Thêm vào màn hình chính</h2><p class="mute">Để mở KidGuard như một app: iPhone (Safari) bấm nút Chia sẻ → "Thêm vào MH chính"; Android (Chrome) bấm ⋮ → "Thêm vào màn hình chính".</p></div>
  <div class="card"><h2>${ic("octagon-x")} Gỡ quản lý</h2><p class="mute">Mở lại mọi app, bỏ mọi giới hạn, bỏ quyền Device Owner. Sau đó gỡ KidGuard như app thường.</p>
    <button id="release" class="bad">${ic("octagon-x")} Gỡ quyền quản lý…</button></div>`;
  if ($("#relayBox")) $("#relayBox").ontoggle = e => { relayOpen = e.target.open; };
  $("#saveName").onclick = () => { cur.name = $("#f-name").value || "Con"; save(kids); render(); };
  $("#savePin").onclick = () => { const p = $("#f-pin").value; if (!/^\d{4,8}$/.test(p)) return toast("warn|PIN 4–8 số"); edit.pin = p; changed(); $("#f-pin").value = ""; };
  if (lan) $("#saveRelay").onclick = async () => {
    const url = $("#relay").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\//.test(url)) return toast("Cần địa chỉ https://");
    const r = await cmd({ type: "relay", url }, "Đã bật");
    if (r && r.token) {
      const link = `${url}/#c=${encodeURIComponent(r.id)}&k=${encodeURIComponent(r.token)}&n=${encodeURIComponent(cur.name)}`;
      $("#relayOut").innerHTML = `<p>${ic("smartphone")} Mở link này trên điện thoại bố mẹ (lưu lại, đừng gửi cho ai):</p><code>${esc(link)}</code>
        <div class="row" style="margin-top:8px"><button id="copy">${ic("clipboard-copy")} Chép link</button><a href="${esc(link)}" target="_blank" rel="noopener"><button>${ic("link")} Mở</button></a></div>`;
      $("#copy").onclick = () => { navigator.clipboard?.writeText(link).then(() => toast("Đã chép"), () => toast("Chép tay giúp nhé")); };
    }
  };
  if ($("#tsOn")) $("#tsOn").onclick = async () => {
    const authKey = $("#f-ts-key").value.trim();
    if (!/^[A-Za-z0-9_-]{10,300}$/.test(authKey)) return toast("warn|Khoá Tailscale không hợp lệ (dạng tskey-auth-…)");
    const r = await cmd({ type: "tailscale", authKey, hostname: $("#f-ts-host").value.trim() }, "Đang cài Tailscale trên máy con…");
    if (r && r.result && r.result !== "ok") toast("err|Máy con trả lời: " + r.result);
    $("#f-ts-key").value = "";
  };
  if ($("#tsOff")) $("#tsOff").onclick = async () => { if (confirm("Tắt điều khiển qua Tailscale và gỡ app Tailscale khỏi máy con?")) await cmd({ type: "tailscaleOff" }, "Đã tắt"); };
  $("#openPair").onclick = async () => {
    const r = await cmd({ type: "openPairing" }, "Mã ghép đang hiện trên máy con");
    if (r && r.result === "set PIN first") toast("warn|Đặt PIN của bố mẹ trước (ngay phía trên), rồi mới mở ghép thêm");
  };
  $("#unpair").onclick = async () => { if (!confirm("Huỷ ghép mọi máy bố mẹ? Phải ghép lại bằng mã trên máy con (cần PIN).")) return; await cmd({ type: "unpairAll" }); };
  $("#forget").onclick = () => { screenStop(); kids = kids.filter(x => x !== cur); save(kids); cur = null; clearInterval(timer); boot(); };
  $("#release").onclick = async () => {
    if (prompt('Gõ "GO" để gỡ quản lý khỏi máy con') !== "GO") return;
    await cmd({ type: "release" }, "Đã gỡ quản lý");
  };
}

boot();
</script>
</body>
</html>
