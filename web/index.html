<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidGuard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KidGuard</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri-fg:#fff;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e5e7eb;--mute:#9ca3af;--line:#263041;--pri:#3b82f6;--chip:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:30px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.app{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:9px;background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1;min-width:0}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-left:4px}
.tag.bad{background:#fee2e2;color:#991b1b}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.on{background:var(--ok)}
.err{color:var(--bad)}
iframe{width:100%;height:220px;border:0;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{white-space:nowrap}
.e{display:inline-block;width:1.4em;text-align:center;margin-right:2px}
.empty{text-align:center;padding:14px 4px;color:var(--mute)}.empty .e{display:block;width:auto;font-size:28px;margin:0 0 4px}
.tabs button.on{background:var(--pri);color:var(--pri-fg)}
code{word-break:break-all;font-size:12px}
button{min-height:44px}
.alert{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600}
.alert.warn{background:#fef3c7;color:#92400e}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:44px;padding:6px 8px}
.chips button.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.sch{border-top:1px solid var(--line);padding:10px 0}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin:6px 0}
.hist button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 0 2px;background:none;border:0;border-radius:6px;font-size:12px;color:var(--mute)}
.hist button i{display:block;width:70%;background:var(--pri);opacity:.45;border-radius:5px 5px 0 0;min-height:2px}
.hist button.on i{opacity:1}.hist button.on{color:var(--fg);font-weight:700;background:var(--chip)}
.scr{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:200px;display:grid;place-items:center}
.scr img{display:block;width:100%;max-height:75vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scr img:not([src]){display:none}
.scr.view img{touch-action:auto}
.scr-msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;text-align:center;pointer-events:none}
.scr-msg:empty{display:none}
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(59,130,246,.6);pointer-events:none;animation:tp .5s forwards}
@keyframes tp{to{transform:scale(1.8);opacity:0}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
// One page for both: served by the child phone on the LAN (/api/...) and by the relay worker (/c/<id>/...).
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "kg.kids";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } };
const save = k => { try { localStorage.setItem(KEY, JSON.stringify(k)); } catch {} };
let kids = load(), cur = null, st = null, pendingRules = null, timer = null, edit = null, tab = "home", lastErr = "", seenAt = 0, answered = new Set(), histSel = -1;
const onLan = () => !location.pathname.startsWith("/c/") && !isRelayOrigin;
let isRelayOrigin = false;

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2500); }
function fmt(ms) { if (ms < 0) return "—"; const m = Math.round(ms / 60000); return m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ " + (m % 60 ? m % 60 + " phút" : ""); }
function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + " giây trước" : s < 3600 ? Math.round(s / 60) + " phút trước" : Math.round(s / 3600) + " giờ trước"; }
const REASON = { blocked: "Đã chặn", appLimit: "Hết giờ app", new: "Chờ duyệt", paused: "Tạm dừng", schedule: "Lịch", bedtime: "Giờ ngủ", daily: "Hết giờ ngày" };
const hhmm = t => new Date(t).toLocaleTimeString("vi", { hour: "2-digit", minute: "2-digit" });
const DNS = [["", "Tắt"], ["family.adguard-dns.com", "AdGuard Family"], ["family.cloudflare-dns.com", "Cloudflare Family"], ["family-filter-dns.cleanbrowsing.org", "CleanBrowsing Family"]];
// rules from older phones may lack v0.2 fields
function norm(e) {
  e.dailyByDay = Array.isArray(e.dailyByDay) && e.dailyByDay.length === 7 ? e.dailyByDay : [];
  e.schedules = e.schedules || []; e.approved = e.approved || []; e.safeDns = e.safeDns || "";
  e.lockLocation = e.lockLocation !== false; e.noAirplane = e.noAirplane !== false; e.blockNew = !!e.blockNew;
  e.blocked = e.blocked || []; e.allow = e.allow || []; e.appMin = e.appMin || {};
  return e;
}
// index 0 = Monday, from "YYYY-MM-DD"
function dayIdx(day) { const [y, m, d] = String(day).split("-").map(Number); return (new Date(y, m - 1, d).getDay() + 6) % 7; }
function baseLimit(r, day) { return r.dailyByDay && r.dailyByDay.length === 7 && day ? +r.dailyByDay[dayIdx(day)] || 0 : r.dailyMin || 0; }
function todayLimit(r, day) { const b = baseLimit(r, day); return b ? b + (r.bonus && r.bonus.day === day ? r.bonus.min || 0 : 0) : 0; }

function base(k) { return k.via === "lan" ? "/api" : "/c/" + encodeURIComponent(k.id); }
async function call(k, path, method = "GET", body) {
  const r = await fetch(base(k) + path, { method, headers: { "X-KG-Token": k.token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// --- boot ---------------------------------------------------------------
async function boot() {
  // a link from the child: #c=<id>&k=<token>&n=<name>
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c") && h.get("k")) {
    isRelayOrigin = true;
    const k = { id: h.get("c"), token: h.get("k"), name: h.get("n") || "Con", via: "relay" };
    kids = kids.filter(x => !(x.id === k.id && x.via === "relay")).concat(k); save(kids);
    history.replaceState(null, "", location.pathname);
    return open(k);
  }
  let hello = null;
  try { const r = await fetch("/api/hello"); if (r.ok) hello = await r.json(); } catch {}
  if (hello) {  // served by the child itself
    const k = kids.find(x => x.via === "lan" && x.id === hello.id);
    if (k) return open(k);
    return pairScreen(hello);
  }
  isRelayOrigin = true;
  const relayKids = kids.filter(k => k.via === "relay");
  if (relayKids.length === 1) return open(relayKids[0]);
  listScreen(relayKids);
}

function pairScreen(hello) {
  $("#app").innerHTML = `<h1>🛡️ KidGuard</h1><div class="card">
    <h2>🔗 Ghép với máy của con</h2>
    ${hello.pairing ? `<p>🔢 Nhập mã 6 số đang hiện trên máy của con.</p>
    <div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:24px;width:9em;letter-spacing:.2em">
    <input id="nm" placeholder="Tên con" value="Con" style="width:8em"><button class="pri" id="go">🔗 Ghép</button></div><p class="err" id="e"></p>`
    : `<p>⏳ Máy của con chưa mở ghép. Trên máy con: mở app KidGuard → <b>Ghép thêm máy của bố mẹ</b> (cần PIN của bố mẹ nếu đã đặt).</p><button onclick="location.reload()">🔄 Thử lại</button>`}
    ${hello.owner ? "" : `<p class="err">⚠️ Máy con chưa có quyền Device Owner: chạy setup.sh (xem README).</p>`}
  </div>`;
  const go = $("#go"); if (!go) return;
  go.onclick = async () => {
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("#code").value }) });
      const j = await r.json();
      if (!r.ok) throw new Error("Sai mã, thử lại");
      const k = { id: j.id, token: j.token, name: $("#nm").value || "Con", via: "lan" };
      kids = kids.filter(x => !(x.id === k.id && x.via === "lan")).concat(k); save(kids); open(k);
    } catch (e) { $("#e").textContent = "❌ " + e.message; }
  };
}

function listScreen(list) {
  $("#app").innerHTML = `<h1>🛡️ KidGuard</h1>` + (list.length ? list.map((k, i) =>
    `<div class="card row"><b class="sp">👦 ${esc(k.name)}</b><button class="pri" data-i="${i}">📂 Mở</button></div>`).join("")
    : `<div class="card empty"><span class="e">📭</span><p>Chưa có máy nào. Mở link "điều khiển từ xa" từ trang của con (khi ở nhà, tab Cài đặt) để thêm.</p></div>`);
  $("#app").querySelectorAll("[data-i]").forEach(b => b.onclick = () => open(list[+b.dataset.i]));
}

// --- one child ------------------------------------------------------------
async function open(k) { screenStop(); cur = k; st = null; edit = null; render(); await refresh(); clearInterval(timer); timer = setInterval(refresh, k.via === "lan" ? 4000 : 8000); }

async function refresh() {
  if (!cur) return;
  try {
    const j = await call(cur, "/state");
    // LAN: the state itself; relay: {state, rules (sent, not yet taken), seen}
    st = j.state !== undefined ? j.state : j;
    pendingRules = j.state !== undefined ? j.rules : null;
    seenAt = j.state !== undefined ? +j.seen || 0 : 0;
    lastErr = "";
  } catch (e) {
    lastErr = e.message;
    if (/not paired/.test(e.message)) { kids = kids.filter(x => x !== cur); save(kids); toast("Thiết bị này đã bị huỷ ghép"); return setTimeout(boot, 1000); }
  }
  if (!edit && st && st.rules) edit = norm(structuredClone(pendingRules && pendingRules.rev > st.rules.rev ? pendingRules : st.rules));
  // redraw the tab only when what it shows changed and nobody is using a control (icons would reload, a select would close)
  const sig = st ? JSON.stringify([tab, st.rules && st.rules.rev, st.apps.map(a => [a.suspended, a.blocked, Math.floor(a.ms / 60000)]),
    st.location && st.location.t, (st.log || []).length, Math.floor(st.usedMs / 60000), lastErr,
    (st.requests || []).map(q => q.id), (st.history || []).length, st.limitMin, (st.apps || []).filter(a => a.new).length]) : lastErr;
  const busy = document.activeElement && /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (tab === "screen") updateLive();   // never redraw the screen tab: the <img> updates by itself
  else if (sig !== lastSig && !busy) { lastSig = sig; render(); } else updateLive();
}
let lastSig = "";

let saveT = null;
function changed() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { const body = { ...edit }; delete body.pinHash; delete body.pinSet; if (!body.pin) delete body.pin;
      const r = await call(cur, "/rules", "PUT", body); const hadPin = !!body.pin; if (cur.via === "lan") edit = norm(r); delete edit.pin; if (hadPin) edit.pinSet = true; delete edit.pinHash; toast(cur.via === "lan" ? "✅ Đã lưu" : "📤 Đã gửi, máy con nhận trong ~20 giây"); }
    catch (e) { toast("❌ Lỗi: " + e.message); }
  }, 500);
}

async function cmd(c, okMsg) {
  try { const r = await call(cur, "/cmd", "POST", c); toast("✅ " + (okMsg || "Đã gửi")); return r; } catch (e) { toast("❌ Lỗi: " + e.message); }
}

function render() {
  if (!cur) return;
  const a = $("#app");
  const focus = document.activeElement && document.activeElement.id;   // keep the field being typed in
  if (focus && /^(f-|msg|relay)/.test(focus)) { updateLive(); return; }
  if (tab !== "screen") screenStop();
  const online = st && Date.now() - st.t < (cur.via === "lan" ? 30000 : 120000);
  a.innerHTML = `
  <div class="row"><h1 class="sp">👦 ${esc(cur.name)}</h1>${kids.length > 1 || cur.via === "relay" ? `<button id="back">☰ Danh sách</button>` : ""}</div>
  <div class="card" id="live"></div>
  <div class="tabs">${[["home", "🏠 Hôm nay"], ["screen", "📱 Màn hình"], ["apps", "🧩 Ứng dụng"], ["rules", "📏 Luật"], ["where", "📍 Vị trí"], ["set", "⚙️ Cài đặt"]].map(([id, n]) => `<button data-tab="${id}" class="${tab === id ? "on" : ""}">${n}</button>`).join("")}</div>
  <div id="body"></div>`;
  a.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  if ($("#back")) $("#back").onclick = () => { screenStop(); cur = null; clearInterval(timer); listScreen(kids.filter(k => k.via === (onLan() ? "lan" : "relay"))); };
  updateLive();
  const body = $("#body");
  if (!st) { body.innerHTML = `<div class="card mute">${lastErr ? "🔴 Không kết nối được: " + esc(lastErr) : "⏳ Đang tải…"}</div>`; return; }
  ({ home: homeTab, screen: screenTab, apps: appsTab, rules: rulesTab, where: whereTab, set: setTab })[tab](body);
}

function updateLive() {
  const el = $("#live"); if (!el) return;
  if (!st) { el.innerHTML = `<span class="mute">${lastErr ? "⚠️ " + esc(lastErr) : "⏳ Đang kết nối…"}</span>`; return; }
  const lan = cur.via === "lan";
  const online = Date.now() - st.t < (lan ? 30000 : 120000);
  
  const lost = lan ? (lastErr || Date.now() - st.t > 300000) : (seenAt && Date.now() - seenAt > 300000);
  const lostFrom = lan ? st.t : seenAt;
  el.innerHTML = `<div class="row"><span>${online ? "🟢" : "🔴"}</span><b>${online ? "Đang kết nối" : "Mất kết nối"}</b>
    <span class="mute">· 🕐 cập nhật ${ago(st.t)}</span><span class="sp"></span><span>🔋 ${st.battery}%${st.charging ? "⚡" : ""}</span></div>
    <div class="mute">📱 ${esc(st.model)} · Android ${esc(st.android)} · ${st.screenOn ? "màn hình bật" + (st.current ? ": <b>" + esc(st.current) + "</b>" : "") : "màn hình tắt"}</div>
    ${pendingRules && st.rules && pendingRules.rev > st.rules.rev ? `<div class="mute">⏳ Luật mới đang chờ máy con nhận</div>` : ""}
    ${lost ? `<div class="alert">🚨 Mất liên lạc với máy con từ ${hhmm(lostFrom)} — máy tắt, mất mạng hoặc KidGuard bị tắt${lastErr && lan ? " (" + esc(lastErr) + ")" : ""}</div>` : ""}
    ${!st.owner ? `<div class="alert">⚠️ Chưa có Device Owner</div>` : ""}
    ${st.usageAccess === false ? `<div class="alert warn">⚠️ Con đã tắt quyền theo dõi sử dụng — giới hạn giờ không hoạt động</div>` : ""}
    ${st.dnsError ? `<div class="alert warn">⚠️ DNS an toàn bị từ chối: ${esc(st.dnsError)}</div>` : ""}
    ${st.acc === false ? `<div class="alert warn">⚠️ Trợ năng đang tắt: không xem/điều khiển màn hình được</div>` : ""}
    ${st.locationOn === false ? `<div class="alert warn">⚠️ Định vị đang tắt</div>` : ""}`;
}

function homeTab(b) {
  const r = edit || st.rules, today = st.day, limit = edit ? todayLimit(r, today) : (st.limitMin ?? r.dailyMin);
  const reqs = (st.requests || []).filter(q => !answered.has(q.id));
  const used = st.usedMs, left = st.leftMs, pct = limit ? Math.min(100, used / (limit * 600)) : 0;
  const pausedLeft = r.pausedUntil - Date.now();
  const blockedNow = st.apps.filter(x => x.suspended);
  b.innerHTML = `
  ${reqs.map(q => `<div class="card" style="border-color:var(--warn)"><b>🙋 Con xin thêm ${+q.min} phút${q.note ? ": " + esc(q.note) : ""}</b>
    <div class="row" style="margin-top:8px"><button class="pri" data-yes="${esc(q.id)}" data-min="${+q.min}">✅ Đồng ý</button><button data-no="${esc(q.id)}">❌ Từ chối</button></div></div>`).join("")}
  <div class="card"><h2>⏱️ Hôm nay</h2>
    <div class="row"><span class="big">${fmt(used)}</span><span class="mute">đã dùng${limit ? " / " + fmt(limit * 60000) + (r.bonus && r.bonus.day === today && r.bonus.min ? " (gồm " + r.bonus.min + " phút thêm)" : "") : " (không giới hạn)"}</span></div>
    ${limit ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="mute">Còn ${fmt(left)}</div>` : ""}
    <div class="row" style="margin-top:10px"><button data-bonus="15">➕ 15 phút</button><button data-bonus="30">➕ 30 phút</button><button data-bonus="60">➕ 1 giờ</button>
    ${r.bonus && r.bonus.day === today && r.bonus.min ? `<button data-bonus="0">↩️ Bỏ thêm giờ</button>` : ""}</div>
  </div>
  <div class="card"><h2>⚡ Ngay bây giờ</h2>
    ${pausedLeft > 0 ? `<p><b>⏸ Đang tạm dừng</b>, còn ${fmt(pausedLeft)} <button id="unpause" class="pri">▶️ Mở lại</button></p>` : ""}
    <div class="grid">
      <button data-pause="30">⏸ Dừng 30 phút</button><button data-pause="60">⏸ Dừng 1 giờ</button><button data-pause="morning">⏸ Dừng tới 6h sáng</button>
      <button id="lock">🔒 Khoá màn hình</button><button id="ring">🔔 Đổ chuông</button><button id="loc">📍 Lấy vị trí</button>
      <button id="reboot" class="bad">🔄 Khởi động lại máy</button>
    </div>
    <div class="row" style="margin-top:10px"><input id="msg" class="sp" placeholder="💬 Nhắn cho con…" maxlength="300"><button id="send" class="pri">✉️ Gửi</button></div>
  </div>
  ${blockedNow.length ? `<div class="card"><h2>🚫 Đang khoá (${blockedNow.length})</h2>${blockedNow.slice(0, 50).map(x => `<span class="tag bad">${esc(x.label)}</span>`).join(" ")}</div>` : ""}
  <div class="card"><h2>📊 7 ngày qua</h2><div class="hist" id="hist"></div><div id="histTop" class="mute"></div></div>
  <div class="card"><h2>🔥 Dùng nhiều nhất</h2>${st.apps.filter(x => x.ms > 60000).slice(0, 8).map(appRow).join("") || `<div class="empty"><span class="e">🌱</span>Chưa có</div>`}</div>

function drawHist() {
  const days = (st.history || []).slice().reverse().concat([{ day: st.day, ms: st.usedMs, top: st.apps.filter(x => x.ms > 0).slice(0, 5) }]);
  const mx = Math.max(60000, ...days.map(d => d.ms)), WD = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  if (histSel < 0 || histSel >= days.length) histSel = days.length - 1;
  const show = () => {
    const d = days[histSel];
    $("#hist").querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i === histSel));
    $("#histTop").innerHTML = `<b>${esc(d.day.slice(8))}/${esc(d.day.slice(5, 7))}: ${fmt(d.ms)}</b>` + ((d.top || []).length ? (d.top || []).map(t => `<div>${esc(t.label || t.pkg)} · ${fmt(t.ms)}</div>`).join("") : "<div>🫥 Không có dữ liệu app</div>");
  };
  $("#hist").innerHTML = days.map((d, i) => `<button data-h="${i}" aria-label="${esc(d.day)}: ${fmt(d.ms)}"><i style="height:${Math.max(2, Math.round(d.ms / mx * 90))}px"></i>${WD[dayIdx(d.day)]}</button>`).join("");
  $("#hist").querySelectorAll("button").forEach(x => x.onclick = () => { histSel = +x.dataset.h; show(); });
  show();
}

// --- live screen + remote control -------------------------------------------
// Runs independently of the 4 s state poll (refresh() never redraws the screen tab).
const scr = { gen: 0, url: null, seq: 0, frames: [], lat: 0, liveT: null, view: false, err: "", msg: "" };
const ERRS = { "acc off": "Chưa bật Trợ năng — chạy lại cài đặt", "screen off": "Màn hình máy con đang tắt", "unsupported": "Máy con dùng Android cũ, chưa hỗ trợ xem màn hình (cần Android 11+)", "busy": "Máy con đang bận, thử lại…" };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const errText = e => ERRS[e] || (e ? "Lỗi: " + e : "");

function screenMsg(t) { scr.msg = t; const m = $("#s-msg"); if (m) m.textContent = t; }
function screenStat() {
  const el = $("#s-stat"); if (!el) return;
  const now = performance.now(); scr.frames = scr.frames.filter(t => now - t < 5000);
  const fps = scr.frames.length > 1 ? (scr.frames.length - 1) / ((scr.frames[scr.frames.length - 1] - scr.frames[0]) / 1000) : 0;
  el.textContent = scr.frames.length ? `${fps.toFixed(1)} khung/giây · trễ ${Math.round(scr.lat)} ms` : "";
}
function showFrame(blob, lat) {
  const old = scr.url; scr.url = URL.createObjectURL(blob);
  const img = $("#s-img"); if (img) img.src = scr.url;
  if (old) URL.revokeObjectURL(old);
  scr.lat = lat; scr.frames.push(performance.now()); screenMsg(""); screenStat();
}
function screenStop() {
  scr.gen++; clearInterval(scr.liveT); scr.liveT = null;
  if (scr.url) { URL.revokeObjectURL(scr.url); scr.url = null; }
  scr.frames = []; scr.seq = 0; scr.msg = "";
}
function screenStart() {
  if (!cur || document.hidden) return;
  const gen = ++scr.gen, k = cur; clearInterval(scr.liveT);
  const img = $("#s-img"); if (img && scr.url) img.src = scr.url;
  screenMsg(scr.msg || "⏳ Đang kết nối…");
  const alive = () => scr.gen === gen && tab === "screen";
  if (k.via === "lan") (async () => {
    while (alive()) {
      const t0 = performance.now();
      try {
        const r = await fetch("/api/screen?max=720&q=50", { headers: { "X-KG-Token": k.token }, cache: "no-store" });
        if (!r.ok) { const j = await r.json().catch(() => ({})); if (alive()) screenMsg(errText(j.error) || "Chưa xem được màn hình"); await sleep(1500); continue; }
        const blob = await r.blob(); if (!alive()) break;
        showFrame(blob, performance.now() - t0);
      } catch { if (alive()) screenMsg("Mất kết nối tới máy con"); await sleep(2000); continue; }
      await sleep(Math.max(0, 400 - (performance.now() - t0)));   // ~2.5 fps
    }
  })();
  else {
    const ping = () => call(k, "/live", "POST", {}).catch(e => { if (alive()) screenMsg("Lỗi: " + e.message); });
    ping(); scr.liveT = setInterval(ping, 10000);
    (async () => {
      screenMsg("Đang chờ máy con kết nối (tối đa ~20 giây)…");
      while (alive()) {
        try {
          const r = await fetch(base(k) + "/frame?after=" + scr.seq, { headers: { "X-KG-Token": k.token }, cache: "no-store" });
          if (!alive()) break;
          if (r.status === 204) { const e = r.headers.get("X-KG-Err"); screenMsg(e ? errText(e) : scr.frames.length ? "" : "Đang chờ máy con kết nối (tối đa ~20 giây)…"); await sleep(200); continue; }
          if (!r.ok) { const j = await r.json().catch(() => ({})); screenMsg("Lỗi: " + (j.error || "HTTP " + r.status)); await sleep(2000); continue; }
          const blob = await r.blob(); if (!alive()) break;
          scr.seq = +r.headers.get("X-KG-Seq") || scr.seq;
          showFrame(blob, +r.headers.get("X-KG-Age") || 0);
        } catch { if (alive()) screenMsg("Mất kết nối, đang thử lại…"); await sleep(2000); }
      }
    })();
  }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) screenStop(); else if (cur && tab === "screen") screenStart(); });

async function sendInput(o) {
  if (scr.view || !cur) return;
  try {
    let r;
    try { r = await call(cur, "/input", "POST", o); }
    catch (e) { if (cur.via !== "relay" || e.message !== "not live") throw e; await call(cur, "/live", "POST", {}); r = await call(cur, "/input", "POST", o); } if (r.result && r.result !== "ok" && r.result !== "queued") toast(errText(r.result)); }
  catch (e) { toast("❌ Lỗi: " + e.message); }
}

    const a = frac({ clientX: d.px, clientY: d.py }, d.r), z = frac(e, d.r);
    const dot = document.createElement("div"); dot.className = "tap"; const br = box.getBoundingClientRect();
    dot.style.left = (e.clientX - br.left) + "px"; dot.style.top = (e.clientY - br.top) + "px"; box.appendChild(dot); setTimeout(() => dot.remove(), 600);
    if (dist < 12) sendInput({ type: dur > 500 ? "long" : "tap", x: +a.x.toFixed(4), y: +a.y.toFixed(4) });
    else sendInput({ type: "swipe", x1: +a.x.toFixed(4), y1: +a.y.toFixed(4), x2: +z.x.toFixed(4), y2: +z.y.toFixed(4), ms: Math.round(Math.min(1500, Math.max(100, dur))) });
  });
  screenStart();
}

function whereTab(b) {
  const l = st.location;
  b.innerHTML = `<div class="card"><h2>📍 Vị trí</h2>${l ? `
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${l.lng - 0.006},${l.lat - 0.004},${l.lng + 0.006},${l.lat + 0.004}&layer=mapnik&marker=${l.lat},${l.lng}"></iframe>
    <p>${ago(l.t)} · sai số ~${Math.round(l.acc)} m · <a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">🗺️ Mở Google Maps</a></p>`
    : `<div class="empty"><span class="e">🗺️</span>Chưa có vị trí. Bật Vị trí trên máy con rồi bấm Lấy vị trí.</div>`}
    <button id="loc2" class="pri">📍 Lấy vị trí mới</button><p class="mute">🔄 Máy con tự gửi vị trí mỗi 15 phút.</p></div>`;
  $("#loc2").onclick = () => cmd({ type: "locate" }, "Đang lấy vị trí…");
}

function setTab(b) {
  const lan = cur.via === "lan";
  b.innerHTML = `
  <div class="card"><h2>👦 Tên</h2><div class="row"><input id="f-name" class="sp" value="${esc(cur.name)}"><button id="saveName">💾 Lưu</button></div></div>
  <div class="card"><h2>🔑 PIN của bố mẹ</h2><p class="mute">Cần PIN này để mở ghép thêm máy ngay trên máy con.</p>
    ${edit.pinSet ? "" : `<div class="alert warn">⚠️ Chưa đặt PIN — nên đặt để con không tự ghép máy</div>`}
    <div class="row"><input id="f-pin" inputmode="numeric" type="password" placeholder="${edit.pinSet ? "✅ Đã đặt PIN" : "Chưa đặt PIN"} (nhập 4–8 số để đổi)" maxlength="8" autocomplete="new-password"><button id="savePin">🔑 ${edit.pinSet ? "Đổi PIN" : "Đặt PIN"}</button></div></div>
  ${lan ? `<div class="card"><h2>🌐 Điều khiển khi khác mạng</h2>
    <p class="mute">Cần một Cloudflare Worker của bạn (miễn phí, xem README). Dán địa chỉ:</p>
    <div class="row"><input id="relay" class="sp" placeholder="https://kidguard.ten-ban.workers.dev" value="${esc(st.relay || "")}"><button id="saveRelay" class="pri">🌐 Bật</button></div>
    <div id="relayOut"></div></div>` : `<div class="card"><h2>🌐 Kết nối</h2><p class="mute">Qua relay. Lệnh tới máy con trong khoảng 20 giây (màn hình tắt: 60 giây).</p></div>`}
  <div class="card"><h2>🔗 Máy đã ghép</h2>
    <div class="grid"><button id="openPair">🔓 Mở ghép thêm (10 phút)</button><button id="unpair" class="bad">⛓️‍💥 Huỷ ghép tất cả</button><button id="forget">🧹 Quên máy này ở trình duyệt</button></div></div>
  <div class="card"><h2>📲 Thêm vào màn hình chính</h2><p class="mute">Để mở KidGuard như một app: iPhone (Safari) bấm nút Chia sẻ → "Thêm vào MH chính"; Android (Chrome) bấm ⋮ → "Thêm vào màn hình chính".</p></div>
  <div class="card"><h2>⛔ Gỡ quản lý</h2><p class="mute">Mở lại mọi app, bỏ mọi giới hạn, bỏ quyền Device Owner. Sau đó gỡ KidGuard như app thường.</p>
    <button id="release" class="bad">⛔ Gỡ quyền quản lý…</button></div>`;
  $("#saveName").onclick = () => { cur.name = $("#f-name").value || "Con"; save(kids); render(); };
  $("#savePin").onclick = () => { const p = $("#f-pin").value; if (!/^\d{4,8}$/.test(p)) return toast("⚠️ PIN 4–8 số"); edit.pin = p; changed(); $("#f-pin").value = ""; };
  if (lan) $("#saveRelay").onclick = async () => {
    const url = $("#relay").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\//.test(url)) return toast("Cần địa chỉ https://");
    const r = await cmd({ type: "relay", url }, "Đã bật");
    if (r && r.token) {
      const link = `${url}/#c=${encodeURIComponent(r.id)}&k=${encodeURIComponent(r.token)}&n=${encodeURIComponent(cur.name)}`;
      $("#relayOut").innerHTML = `<p>📲 Mở link này trên điện thoại bố mẹ (lưu lại, đừng gửi cho ai):</p><code>${esc(link)}</code>
        <div class="row" style="margin-top:8px"><button id="copy">📋 Chép link</button><a href="${esc(link)}" target="_blank" rel="noopener"><button>🔗 Mở</button></a></div>`;
      $("#copy").onclick = () => { navigator.clipboard?.writeText(link).then(() => toast("Đã chép"), () => toast("Chép tay giúp nhé")); };
    }
  };
  $("#openPair").onclick = () => cmd({ type: "openPairing" }, "Mã ghép đang hiện trên máy con");
  $("#unpair").onclick = async () => { if (!confirm("Huỷ ghép mọi máy bố mẹ? Phải ghép lại bằng mã trên máy con (cần PIN).")) return; await cmd({ type: "unpairAll" }); };
  $("#forget").onclick = () => { screenStop(); kids = kids.filter(x => x !== cur); save(kids); cur = null; clearInterval(timer); boot(); };
  $("#release").onclick = async () => {
    if (prompt('Gõ "GO" để gỡ quản lý khỏi máy con') !== "GO") return;
    await cmd({ type: "release" }, "Đã gỡ quản lý");
  };
}

boot();
</script>
</body>
</html>
