<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidGuard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KidGuard</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--btn:#2563eb;--pri-fg:#fff;--bad-bg:#fee2e2;--bad-fg:#991b1b;--ok-bg:#dcfce7;--ok-fg:#166534;--warn-bg:#fef3c7;--warn-fg:#92400e;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e5e7eb;--mute:#9ca3af;--line:#263041;--pri:#3b82f6;--chip:#1e293b;--btn:#2563eb;--bad-bg:#3b1519;--bad-fg:#fca5a5;--ok-bg:#12301d;--ok-fg:#86efac;--warn-bg:#3a2a0b;--warn-fg:#fcd34d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.big{font-size:30px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:inherit;text-decoration:none;box-sizing:border-box}
button:active{filter:brightness(.92)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.pri{background:var(--btn);color:var(--pri-fg);border-color:var(--btn);font-weight:600}
button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select{max-width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.pairf{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pairf input,.pairf button{width:100%}
#code{font-size:28px;text-align:center;letter-spacing:.35em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.app{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:9px;background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:100%;height:100%}
.app .nm{flex:1 1 50px;min-width:0}.app>button,.app>select{flex:none;margin-left:auto}.app>select{max-width:54%;padding-left:8px;padding-right:2px}.app .tag{white-space:nowrap}
.app .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-left:4px}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
.si{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none}
.err{color:var(--bad)}
iframe{width:100%;height:220px;border:0;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
/* fade the edge that still has tabs behind it (toggled by tabFade) */
.tabs.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
.tabs.fl{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent)}
.tabs.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.tabs button{white-space:nowrap}
.e{display:inline-block;width:1.4em;text-align:center;margin-right:2px}
.empty{text-align:center;padding:14px 4px;color:var(--mute)}.empty .e{display:block;width:auto;font-size:28px;margin:0 0 4px}
.tabs button.on{background:var(--btn);color:var(--pri-fg)}
code{word-break:break-all;font-size:12px}
button{min-height:44px}
.alert{background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg)}
.dpb{display:inline-flex;align-items:center;gap:6px;font-weight:600}
#dpPop,#askPop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#dpPop .dp,#askPop .dp{background:var(--card);color:var(--fg,inherit);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dpg button{min-height:38px;padding:2px;min-width:0}.dpg span{text-align:center;padding:9px 0;font-size:14px}
.dpg button.sel{outline:2px solid var(--ok);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:44px;padding:6px 8px}
.chips button.on{background:var(--btn);color:var(--pri-fg);border-color:var(--btn)}
.sch{border-top:1px solid var(--line);padding:10px 0}
.sw{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dp .app{padding:8px 0}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin:6px 0}
.hist button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 0 2px;background:none;border:0;border-radius:6px;font-size:12px;color:var(--mute)}
.hist button i{display:block;width:70%;background:var(--pri);opacity:.45;border-radius:5px 5px 0 0;min-height:2px}
.hist button.on i{opacity:1}.hist button.on{color:var(--fg);font-weight:700;background:var(--chip)}
.scr{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:200px;display:grid;place-items:center}
.scr img{display:block;width:100%;max-height:75vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scr img:not([src]){display:none}
.scr.view img{touch-action:auto}
.scr-msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;text-align:center;pointer-events:none}
.scr-msg:empty{display:none}
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(59,130,246,.6);pointer-events:none;animation:tp .5s forwards}
@keyframes tp{to{transform:scale(1.8);opacity:0}}
.bulk{position:sticky;bottom:8px;background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);margin-top:8px}
.app input[type=checkbox]{flex:none}label.app{cursor:pointer}
.map{position:relative;height:260px;border-radius:10px;overflow:hidden;background:var(--chip);touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px}
.map .layer{position:absolute;inset:0}.map img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map svg{position:absolute;overflow:visible}.map circle{cursor:pointer}
.map .mz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.map .mz button{min-height:36px;width:36px;padding:0;background:var(--card)}
.map .attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);color:#333;font-size:11px;padding:1px 5px}.map .attr a{color:#333}
#ear{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(380px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);color:var(--fg);border:2px solid var(--warn);border-radius:12px;padding:8px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:20}
.sos{border:2px solid var(--bad)}
.ovk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.ovk .card{margin:0}
.ovk .nm{display:flex;align-items:center;gap:8px}.ovk .sw{width:12px;height:12px;border-radius:50%;flex:none}
.ovb{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}.ovb>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ovb .g{display:flex;gap:2px;align-items:flex-end;height:104px;width:100%;justify-content:center}.ovb .g i{flex:1;max-width:14px;border-radius:3px 3px 0 0;min-height:2px}
.map .pin{position:absolute;transform:translate(-50%,-100%);background:var(--card);color:var(--fg);border:2px solid;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
#saveBar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--bad,#b91c1c);color:#fff}
#saveBar button{margin-left:auto}
body.sb #toast{bottom:76px}
.row.tm{flex-wrap:nowrap}.row.tm input[type=time]{width:7em;padding:8px 6px}
a{color:var(--pri)}
a.lnkbtn{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:9px 14px;text-decoration:none}
select.lang{min-height:40px;padding:4px 8px;font-size:14px;flex:none}
#toast{position:fixed;z-index:80;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>

async function boot() {

  if (APP) return appBoot();

  const h = new URLSearchParams(location.hash.slice(1));
  // QR from the child's screen: #pair=<6 digits> prefills the code; drop the hash so a reload does not reuse it
  const pc = /^\d{6}$/.test(h.get("pair") || "") ? h.get("pair") : "";
  if (h.has("pair")) history.replaceState(null, "", location.pathname + location.search);
  if (h.get("c") && h.get("k")) {
    isRelayOrigin = true;
    const k = { id: h.get("c"), token: h.get("k"), name: h.get("n") || t("kid"), via: "relay" };
    kids = kids.filter(x => !(x.id === k.id && x.via === "relay")).concat(k); save(kids);
    history.replaceState(null, "", location.pathname);

  }
  let hello = null;

  if (hello) {  // served by the child itself

  const mode = p => edit.blocked.includes(p) ? "block" : edit.allow.includes(p) ? "allow" : edit.appMin[p] ? "limit" : "normal";
  const isNew = x => x.new && !edit.approved.includes(x.pkg);
  const FILT = [["all", t("f.all")], ["new", ic("sparkles") + " " + t("f.new")], ["blocked", ic("octagon-x") + " " + t("f.blocked")], ["limited", ic("timer") + " " + t("f.limited")]];
  const pass = x => { const m = mode(x.pkg); return sel.f === "all" || (sel.f === "new" && isNew(x)) || (sel.f === "blocked" && (m === "block" || x.suspended)) || (sel.f === "limited" && m === "limit"); };
  const visible = () => { const q = ($("#f-q").value || "").toLowerCase(); return st.apps.filter(x => !x.protected && pass(x) && (!q || x.label.toLowerCase().includes(q) || x.pkg.includes(q))); };
  b.innerHTML = `<div class="card"><div class="row"><h2 class="sp" style="margin:0">${ic("puzzle")} ${t("apps.h", st.apps.length)}</h2><button id="selTog" class="${sel.on ? "pri" : ""}">${sel.on ? ic("x") + " " + t("sel.exit") : ic("square-check") + " " + t("sel.on")}</button></div>
    <input id="f-q" placeholder="${esc(t("apps.search"))}" aria-label="${esc(t("apps.search"))}" style="width:100%;margin:10px 0 6px">
    <div class="chips" id="flt">${FILT.map(([v, n]) => `<button data-f="${v}" class="${sel.f === v ? "on" : ""}">${n}</button>`).join("")}</div>
    ${sel.on ? `<div class="row" style="margin-top:8px"><button id="selAll">${ic("square-check")} ${t("sel.all")}</button><button id="selNone">${ic("square")} ${t("sel.none")}</button></div>` : ""}
    <div id="list"></div><p class="mute">${ic("lightbulb")} ${t("apps.tip")}</p></div>
    ${sel.on ? `<div class="bulk" id="bulk"></div>` : ""}${cleanHtml()}`;
  const drawBar = () => {
    const bar = $("#bulk"); if (!bar) return;
    const n = sel.set.size, dis = n ? "" : "disabled";
    bar.innerHTML = `<div class="row"><b class="sp">${ic("check")} ${t("sel.n", n)}</b></div>
      <div class="row" style="margin-top:6px"><button ${dis} data-a="block" class="bad">${ic("octagon-x")} ${t("block")}</button><button ${dis} data-a="unblock">${ic("circle-check")} ${t("unblock")}</button><button ${dis} data-a="allow">${ic("star")} ${t("allow")}</button><button ${dis} data-a="lim">${ic("timer")} ${t("limitX")}</button><button ${dis} data-a="unlim">${ic("trash-2")} ${t("unlimit")}</button><button ${dis} data-a="approve">${ic("thumbs-up")} ${t("approve")}</button></div>
      ${sel.limOpen ? `<div class="row" style="margin-top:6px"><input id="f-lim" type="number" min="1" max="1440" step="5" inputmode="numeric" placeholder="${esc(t("minPerDay"))}" aria-label="${esc(t("minPerDay"))}" style="width:9em"><button id="limOk" class="pri" ${dis}>${ic("circle-check")} ${t("apply")}</button></div>` : ""}`;
    const clr = p => { edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p]; };
    // k: "bulk.<k>" asks "Block 3 apps?", "bulk.<k>Done" says "Blocked 3 apps"; m: minutes for "lim"
    const apply = async (k, fn, m) => {
      const pk = [...sel.set].filter(p => { const a = st.apps.find(x => x.pkg === p); return a && !a.protected; });
      if (!pk.length) return toast("warn|" + t("sel.noneYet"));
      if (!(await ask(t("bulk." + k, pk.length, m)))) return;
      pk.forEach(fn); changed(); toast("ok|" + t("bulk." + k + "Done", pk.length, m)); sel.set.clear(); sel.limOpen = false; draw(); setTimeout(refresh, 1200);   // one PUT (debounced), then refresh
    };
    bar.querySelectorAll("[data-a]").forEach(x => x.onclick = () => {
      const a = x.dataset.a;
      if (a === "block") apply("block", p => { clr(p); edit.blocked.push(p); });
      else if (a === "unblock") apply("unblock", p => { edit.blocked = edit.blocked.filter(v => v !== p); });
      else if (a === "allow") apply("allow", p => { clr(p); edit.allow.push(p); });
      else if (a === "unlim") apply("unlim", p => { delete edit.appMin[p]; });
      else if (a === "approve") apply("approve", p => { if (!edit.approved.includes(p)) edit.approved.push(p); });
      else if (a === "lim") { sel.limOpen = !sel.limOpen; drawBar(); const i = $("#f-lim"); if (i) i.focus(); }
    });
    if ($("#limOk")) $("#limOk").onclick = () => {
      const m = Math.round(+$("#f-lim").value); if (!(m >= 1 && m <= 1440)) return toast("warn|" + t("lim.range"));
      apply("lim", p => { edit.blocked = edit.blocked.filter(v => v !== p); edit.allow = edit.allow.filter(v => v !== p); edit.appMin[p] = m; }, m);
    };
  };
  const draw = () => {
    const vis = visible();
    $("#list").innerHTML = vis.map(x => {
      const m = mode(x.pkg), nw = isNew(x);
      const info = `<div class="nm"><b>${esc(x.label)}</b><span class="mute">${t("todayV", fmt(x.ms))}${x.suspended || x.blocked ? `<span class="tag bad">${reason(x.blocked)}</span>` : ""}${nw ? `<span class="tag" style="background:#fef3c7;color:#92400e">${ic("sparkles")} ${t("newInst")}</span>` : ""}${m === "block" ? `<span class="tag bad">${ic("octagon-x")} ${t("block")}</span>` : m === "allow" ? `<span class="tag" title="${esc(t("allow"))}">${ic("star")}</span>` : m === "limit" ? `<span class="tag">${ic("timer")} ${t("fmt.m", edit.appMin[x.pkg])}</span>` : ""}</span></div>`;
      if (sel.on) return `<label class="app"><input type="checkbox" data-c="${esc(x.pkg)}" ${sel.set.has(x.pkg) ? "checked" : ""}>${icon(x)}${info}</label>`;
      return `<div class="app">${icon(x)}${info}
      ${nw ? `<button class="pri" data-ok="${esc(x.pkg)}">${ic("circle-check")} ${t("permit")}</button>` : ""}
      <select data-p="${esc(x.pkg)}" aria-label="${esc(t("apps.rule", x.label))}">
        <option value="normal" ${m === "normal" ? "selected" : ""}>${t("normal")}</option>
        ${[15, 30, 45, 60, 90, 120].map(n => `<option value="${n}" ${m === "limit" && edit.appMin[x.pkg] === n ? "selected" : ""}>${t("perDay", n)}</option>`).join("")}
        ${m === "limit" && ![15, 30, 45, 60, 90, 120].includes(edit.appMin[x.pkg]) ? `<option value="${edit.appMin[x.pkg]}" selected>${t("perDay", edit.appMin[x.pkg])}</option>` : ""}
        <option value="block" ${m === "block" ? "selected" : ""}>${t("block")}</option>
        <option value="allow" ${m === "allow" ? "selected" : ""}>${t("allow")}</option>
      </select></div>`;
    }).join("") || `<div class="empty"><span class="e">${ic("circle-dashed")}</span>${t("apps.none")}</div>`;
    $("#list").querySelectorAll("[data-ok]").forEach(bt => bt.onclick = () => { edit.approved.push(bt.dataset.ok); changed(); draw(); toast("ok|" + t("permitted")); });
    $("#list").querySelectorAll("[data-c]").forEach(c => c.onchange = () => { c.checked ? sel.set.add(c.dataset.c) : sel.set.delete(c.dataset.c); drawBar(); });
    $("#list").querySelectorAll("select").forEach(s => s.onchange = () => {
      const p = s.dataset.p, v = s.value;
      edit.blocked = edit.blocked.filter(x => x !== p); edit.allow = edit.allow.filter(x => x !== p); delete edit.appMin[p];
      if (v === "block") edit.blocked.push(p); else if (v === "allow") edit.allow.push(p); else if (v !== "normal") edit.appMin[p] = +v;
      changed();
    });
    drawBar();
  };
  $("#f-q").oninput = draw;
  $("#selTog").onclick = () => { sel.on = !sel.on; sel.set.clear(); sel.limOpen = false; appsTab(b); };
  b.querySelectorAll("#flt [data-f]").forEach(x => x.onclick = () => { sel.f = x.dataset.f; appsTab(b); });
  if ($("#selAll")) $("#selAll").onclick = () => { visible().forEach(x => sel.set.add(x.pkg)); draw(); };
  if ($("#selNone")) $("#selNone").onclick = () => { sel.set.clear(); draw(); };
  draw(); cleanWire(b);
}

// v0.8 phone clean-up: hide preinstalled bloat (owner), clear an app's data (owner, Android 9+), heaviest apps (both modes)
let cleanAll = false;
const mbTxt = m => m >= 1024 ? (m / 1024).toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " GB" : m + " MB";
function cleanHtml() {
  const heavy = (st.apps || []).filter(x => x.mb > 0).sort((a, b) => b.mb - a.mb).slice(0, 8);
  const pre = st.preinstalled || [], owner = !isBasic() && st.owner !== false;
  const hid = p => edit.hidden.includes(p);
  const list = cleanAll ? pre : pre.filter(x => x.suggest || hid(x.pkg) || x.hidden);
  const nHid = pre.filter(x => hid(x.pkg)).length;
  return `<div class="card"><h2>${ic("sparkles")} ${t("clean.h")}</h2>
    ${owner && st.preinstalled ? `<p class="mute">${ic("eye-off")} ${t("clean.p", "<b>" + nHid + "</b>")}</p>
      <div id="pre">${list.map(x => `<label class="app"><input type="checkbox" data-h="${esc(x.pkg)}" ${hid(x.pkg) ? "checked" : ""}><div class="nm"><b>${esc(x.label)}</b><span class="mute">${esc(x.pkg)}${x.mb ? " · " + mbTxt(x.mb) : ""}${x.suggest ? `<span class="tag warn">${t("clean.sug")}</span>` : ""}</span></div></label>`).join("") || `<p class="mute">${t("clean.noSug")}</p>`}</div>
      <div class="row" style="margin-top:8px">${pre.some(x => x.suggest && !hid(x.pkg)) ? `<button id="hideSug">${ic("eye-off")} ${t("clean.hideSug")}</button>` : ""}<button id="preAll">${cleanAll ? t("clean.onlySug") : t("clean.all", pre.length)}</button></div>`
      : owner ? `<p class="mute">${ic("hourglass")} ${t("clean.noList")}</p>` : needOwner(t("no.hide"))}
    <h2 style="margin-top:14px">${ic("hard-drive")} ${t("clean.heavy")}</h2>
    ${heavy.length ? heavy.map(x => `<div class="app">${icon(x)}<div class="nm"><b>${esc(x.label)}</b><span class="mute">${mbTxt(x.mb)}</span></div>${owner && !x.protected ? `<button data-clr="${esc(x.pkg)}" class="bad">${ic("trash-2")} ${t("clean.clear")}</button>` : ""}</div>`).join("")
      : `<p class="mute">${t("clean.noSize")}</p>`}
    <p class="mute">${ic("lightbulb")} ${owner ? t("clean.tipOwner") : t("clean.tipBasic")} ${t("clean.tipRam")}</p></div>`;
}
function cleanWire(b) {
  b.querySelectorAll("[data-h]").forEach(c => c.onchange = () => {
    const p = c.dataset.h; edit.hidden = edit.hidden.filter(x => x !== p); if (c.checked) edit.hidden.push(p);
    changed(); toast("ok|" + (c.checked ? t("hidden") : t("unhidden"))); setTimeout(refresh, 1500);
  });
  if ($("#hideSug")) $("#hideSug").onclick = async () => {
    const add = (st.preinstalled || []).filter(x => x.suggest && !edit.hidden.includes(x.pkg));
    if (!(await ask(t("clean.askHide", add.length, add.map(x => x.label).join(", ")), t("hide")))) return;
    add.forEach(x => edit.hidden.push(x.pkg)); changed(); toast("ok|" + t("clean.hidN", add.length)); appsTab(b); setTimeout(refresh, 1500);
  };
  if ($("#preAll")) $("#preAll").onclick = () => { cleanAll = !cleanAll; appsTab(b); };
  b.querySelectorAll("[data-clr]").forEach(x => x.onclick = () => {
    const a = (st.apps || []).find(y => y.pkg === x.dataset.clr); if (!a) return;
    cmd({ type: "clearData", pkg: a.pkg }, t("clean.cleared", a.label),
      [t("clean.askClear", a.label), t("delete"), true]).then(() => setTimeout(refresh, 2000));
  });
}

// warning under a time range (bedtime / schedule) that would never block anything
function timeWarn(x, on, sch) {
  if (!on) return "";
  const m = [];
  if (!x.start || !x.end) m.push(t("tw.missing"));
  else if (x.start === x.end) m.push(t("tw.same"));
  if (sch && !(x.days || []).length) m.push(t("tw.noDays"));
  return m.map(w => `<div class="alert warn" style="margin-top:8px">${ic("triangle-alert")} ${w}</div>`).join("");
}

// --- live screen + remote control -------------------------------------------
// Runs independently of the 4 s state poll (refresh() never redraws the screen tab).
const scr = { gen: 0, url: null, seq: 0, frames: [], lat: 0, liveT: null, view: false, err: "", msg: "" };
// screen errors from the phone (Acc.lastError): keys "se.<code>"
const sleep = ms => new Promise(r => setTimeout(r, ms));
const errText = e => tc("se.", e, e ? t("errX", e) : "");

function screenMsg(t) { scr.msg = t; const m = $("#s-msg"); if (m) m.textContent = t; }
function screenStat() {
  const el = $("#s-stat"); if (!el) return;
  const now = performance.now(); scr.frames = scr.frames.filter(t => now - t < 5000);
  const fps = scr.frames.length > 1 ? (scr.frames.length - 1) / ((scr.frames[scr.frames.length - 1] - scr.frames[0]) / 1000) : 0;
  el.textContent = scr.frames.length ? t("scr.stat", fps.toLocaleString(lang, { maximumFractionDigits: 1, minimumFractionDigits: 1 }), Math.round(scr.lat)) : "";
}
function showFrame(blob, lat) {
  const old = scr.url; scr.url = URL.createObjectURL(blob);
  const img = $("#s-img"); if (img) img.src = scr.url;
  if (old) URL.revokeObjectURL(old);
  scr.lat = lat; scr.frames.push(performance.now()); screenMsg(""); screenStat();
}
function screenStop() {
  scr.gen++; clearInterval(scr.liveT); scr.liveT = null;
  if (scr.url) { URL.revokeObjectURL(scr.url); scr.url = null; }
  scr.frames = []; scr.seq = 0; scr.msg = "";
}
function screenStart() {
  if (!cur || document.hidden) return;
  const gen = ++scr.gen, k = cur; clearInterval(scr.liveT);
  const img = $("#s-img"); if (img && scr.url) img.src = scr.url;
  screenMsg(scr.msg || t("connecting"));
  const alive = () => scr.gen === gen && tab === "screen";
  if (k.via === "lan") (async () => {
    while (alive()) {
      const t0 = performance.now();
      try {
        const r = await fetch(base(k) + "/screen?max=720&q=50", { headers: { "X-KG-Token": k.token }, cache: "no-store" });
        if (!r.ok) { const j = await r.json().catch(() => ({})); if (alive()) screenMsg(errText(j.error) || t("scr.cant")); await sleep(1500); continue; }
        const blob = await r.blob(); if (!alive()) break;
        showFrame(blob, performance.now() - t0);
      } catch { if (alive()) screenMsg(t("scr.lost")); await sleep(2000); continue; }
      await sleep(Math.max(0, 400 - (performance.now() - t0)));   // ~2.5 fps
    }
  })();
  else {
    const ping = () => call(k, "/live", "POST", {}).catch(e => { if (alive()) screenMsg(t("errX", e.message)); });
    ping(); scr.liveT = setInterval(ping, 10000);
    (async () => {
      screenMsg(t("scr.wait"));
      while (alive()) {
        try {
          const r = await fetch(base(k) + "/frame?after=" + scr.seq, { headers: { "X-KG-Token": k.token }, cache: "no-store" });
          if (!alive()) break;
          if (r.status === 204) { const e = r.headers.get("X-KG-Err"); screenMsg(e ? errText(e) : scr.frames.length ? "" : t("scr.wait")); await sleep(200); continue; }
          if (!r.ok) { const j = await r.json().catch(() => ({})); screenMsg(t("errX", j.error || "HTTP " + r.status)); await sleep(2000); continue; }
          const blob = await r.blob(); if (!alive()) break;
          scr.seq = +r.headers.get("X-KG-Seq") || scr.seq;
          showFrame(blob, +r.headers.get("X-KG-Age") || 0);
        } catch { if (alive()) screenMsg(t("scr.retry")); await sleep(2000); }
      }
    })();
  }
}
// hidden page (tab in background, parent app paused): the poll timers skip their fetch; catch up at once when shown again
document.addEventListener("visibilitychange", () => { if (document.hidden) screenStop(); else { if (cur && tab === "screen") screenStart(); if (cur) refresh(); else if (ov) ovLoad(); } });

async function sendInput(o) {
  if (scr.view || !cur) return;
  try {
    let r;
    try { r = await call(cur, "/input", "POST", o); }
    catch (e) { if (cur.via !== "relay" || e.raw !== "not live") throw e; await call(cur, "/live", "POST", {}); r = await call(cur, "/input", "POST", o); } if (r.result && r.result !== "ok" && r.result !== "queued") toast(errText(r.result)); }
  catch (e) { toast("err|" + t("errX", e.message)); }
}

function screenTab(b) {
  b.innerHTML = `<div class="card"><div class="row"><h2 class="sp" style="margin:0">${ic("smartphone")} ${t("scr.h")}</h2>

    <div class="mute" id="s-stat" style="margin:4px 0"></div>

      <button data-key="notifications">${ic("bell")} ${t("key.notif")}</button><button data-key="lock">${ic("lock")} ${t("lockScr")}</button></div>

    <label class="row" style="margin-top:10px"><input type="checkbox" id="f-sw" ${edit && edit.showWatching ? "checked" : ""}><span>${ic("bell")} ${t("scr.notify")}</span></label>

  $("#f-sw").onchange = e => { if (!edit) return; edit.showWatching = e.target.checked; changed(); };

  $("#s-send").onclick = () => { const t = $("#f-stxt").value; if (!t) return; sendInput({ type: "text", text: t }); $("#f-stxt").value = ""; };
  let down = null;
  const frac = (e, r) => ({ x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) });
  img.addEventListener("pointerdown", e => { if (scr.view || !img.src) return; e.preventDefault(); img.setPointerCapture(e.pointerId); down = { px: e.clientX, py: e.clientY, t: performance.now(), r: img.getBoundingClientRect() }; });
  img.addEventListener("contextmenu", e => e.preventDefault());
  img.addEventListener("pointercancel", () => { down = null; });
  img.addEventListener("pointerup", e => {
    if (!down) return; const d = down; down = null;
    const dur = performance.now() - d.t, dist = Math.hypot(e.clientX - d.px, e.clientY - d.py);
    const a = frac({ clientX: d.px, clientY: d.py }, d.r), z = frac(e, d.r);
    const dot = document.createElement("div"); dot.className = "tap"; const br = box.getBoundingClientRect();
    dot.style.left = (e.clientX - br.left) + "px"; dot.style.top = (e.clientY - br.top) + "px"; box.appendChild(dot); setTimeout(() => dot.remove(), 600);
    if (dist < 12) sendInput({ type: dur > 500 ? "long" : "tap", x: +a.x.toFixed(4), y: +a.y.toFixed(4) });
    else sendInput({ type: "swipe", x1: +a.x.toFixed(4), y1: +a.y.toFixed(4), x2: +z.x.toFixed(4), y2: +z.y.toFixed(4), ms: Math.round(Math.min(1500, Math.max(100, dur))) });
  });
  screenStart();
}

  if ($("#updNow")) $("#updNow").onclick = () => cmd({ type: "update" }, t("upd.sent"), [t("upd.ask"), t("upd.ok")]).then(() => setTimeout(refresh, 4000));
  $("#release").onclick = async () => {
    await cmd({ type: "release" }, t("rel.done"), [t("rel.ask"), t("rel.ok"), true, t("rel.word")]);
  };
}

appLang();
applyLang();
boot();
</script>
