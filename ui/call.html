<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Child phone's video call screen (CallActivity WebView, https://appassets.androidplatform.net/call.html). Not served by the
     LAN server or the relay. WebRTC in assets/rtc.js (shared with the parent page). Bridge: window.KG (Call.kt). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' blob: mediastream:; img-src data:">
<title>KidGuard</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#remote{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#0b1220}
#local{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));width:96px;height:128px;object-fit:cover;border-radius:14px;background:#1e293b;transform:scaleX(-1);display:none}
.top{position:fixed;left:20px;right:124px;top:calc(20px + env(safe-area-inset-top));text-shadow:0 1px 3px #000}
.top b{display:block;font-size:22px}
#ring{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b1220;text-align:center;padding:24px}
#ring .av{width:120px;height:120px;border-radius:50%;background:#1e3a8a;display:flex;align-items:center;justify-content:center;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}100%{box-shadow:0 0 0 36px rgba(59,130,246,0)}}
#ring h1{margin:0;font-size:26px;font-weight:600}
.row{position:fixed;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:56px}
.b{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:#fff;font:inherit;padding:0}
.b i{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2)}
.b.ok i{background:#16a34a}.b.no i{background:#dc2626}.b.on i{background:#fff;color:#0f172a}
.b svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{display:none;gap:40px}#bar .b i{width:64px;height:64px}#bar .b svg{width:28px;height:28px}
#off{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;color:#cbd5e1}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;font-size:20px;display:none;padding:0 24px;text-shadow:0 1px 3px #000}
</style></head><body>
<video id="remote" autoplay playsinline></video>
<div id="off"></div>
<video id="local" autoplay playsinline muted></video>
<div class="top" id="top" style="display:none"><b id="who"></b><span id="st"></span></div>
<div id="ring"><div class="av"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#fff" stroke-width="2"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></div><h1 id="from"></h1></div>
<div class="row" id="ask">
  <button class="b no" id="no"><i><svg viewBox="0 0 24 24"><path d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"/><path d="M22 2 2 22"/><path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473"/></svg></i><span id="noL"></span></button>
  <button class="b ok" id="yes"><i><svg viewBox="0 0 24 24"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg></i><span id="yesL"></span></button>
</div>
<div class="row" id="bar">
  <button class="b" id="mic"><i><svg viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></i><span id="micL"></span></button>
  <button class="b no" id="end"><i><svg viewBox="0 0 24 24"><path d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"/><path d="M22 2 2 22"/><path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473"/></svg></i><span id="endL"></span></button>
  <button class="b" id="cam"><i><svg viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></i><span id="camL"></span></button>
</div>
<div id="msg"></div>
<script src="/assets/rtc.js"></script>
<script>
"use strict";
const $ = (s) => document.getElementById(s), W = JSON.parse(KG.words() || "{}"), O = JSON.parse(KG.offer() || "null");
const MAX = 15 * 60e3;
let c = null, t0 = 0, max = MAX, over = false, mic = true, cam = true, tick = 0;
$("from").textContent = W.from || ""; $("who").textContent = (O && O.by) || "";
$("noL").textContent = W.decline; $("yesL").textContent = W.answer; $("endL").textContent = W.end; $("micL").textContent = W.mute; $("camL").textContent = W.cam;
function say(s) { const m = $("msg"); m.textContent = s || ""; m.style.display = s ? "block" : "none"; }
function status() {
  if (over) return;
  if (!t0) { $("st").textContent = W.conn; return; }
  const ms = Date.now() - t0, s = Math.floor(ms / 1000);
  if (ms > max) return end("timeout", true, W.ended);
  $("st").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + (c && c.net().low ? " · " + W.low : "");
}
// over: tell = post "end" to the relay; line = what to show for 2 s before the screen closes
function end(why, tell, line) {
  if (over) return; over = true;
  clearInterval(tick);
  if (c) c.close();
  if (tell) try { KG.signal("end", "", why); } catch (e) {}
  $("ask").style.display = "none"; $("bar").style.display = "none"; $("ring").style.display = "none";
  say(line || W.ended);
  setTimeout(() => KG.close(why), 2000);
}
window.kgEnd = (why) => end(why, false, why === "hangup" ? W.parentEnd : why === "missed" ? W.missed : W.ended);
window.kgBack = () => end(t0 || c ? "hangup" : "decline", true, W.ended);
$("no").onclick = () => end("decline", true, W.ended);
$("yes").onclick = async () => {
  if (!O || over) return;
  if (!KG.answerTap()) return end("noperm", true, W.noperm);
  $("ask").style.display = "none"; $("ring").style.display = "none"; $("top").style.display = "block"; $("local").style.display = "block";
  $("bar").style.display = "flex"; status(); tick = setInterval(status, 1000);
  try {
    c = await RTC.open({ ice: O.ice, offer: O.sdp, video: true, local: $("local"), remote: $("remote"),
      onState: (s) => { if (s === "connected") { if (!t0) t0 = Date.now(); say(""); } else if (s === "disconnected") say(W.weak); else if (s === "failed") end("failed", true, W.fail); },
      onMsg: (m) => { if (m.t === "bye") end("hangup", false, W.parentEnd); else if (m.t === "more") { max += MAX; say(W.more); setTimeout(() => say(""), 2500); } else if (m.t === "cam") { $("off").style.display = m.on ? "none" : "flex"; } } });
    if (over) return c.close();
    const r = JSON.parse(KG.signal("answer", c.sdp, "") || "{}");
    if (r.error) end("failed", false, W.fail);
  } catch (e) { end(/NotAllowed|Permission/i.test(String(e && e.name)) ? "noperm" : "nocam", true, W.noperm); }
};
$("mic").onclick = () => { if (!c) return; mic = !mic; c.mute(!mic); $("mic").classList.toggle("on", !mic); };
$("cam").onclick = () => { if (!c) return; cam = !cam; c.camera(cam); $("cam").classList.toggle("on", !cam); $("local").style.opacity = cam ? 1 : .3; };
if (!O) end("", false, W.ended);
</script>
</body></html>
